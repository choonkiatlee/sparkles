name: motion-source-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Bounded live retailer smoke
        run: |
          python - <<'PY'
          from diamond_retrieval import retrieve_diamond
          urls = [
              ("quality-diamonds", "https://www.qualitydiamonds.co.uk/loose-diamonds/buy-loose-diamonds?d=133%2FF74D0EF67"),
              ("diyona", "https://diyona.com/pages/diamond-detail?sku=F8D42074F"),
          ]
          for name, url in urls:
              print("===", name, "===")
              try:
                  result = retrieve_diamond(url)
              except Exception as exc:
                  print("error=", type(exc).__name__, str(exc))
                  continue
              print("report=", result.metadata.report_number)
              print("status=", result.status.value)
              print("certificates=", len(result.certificates))
              print("stills=", len(result.stills))
              print("rotations=", len(result.rotations))
              print("videos=", len(result.videos))
              print("rotation_frames=", [len(item.frames) for item in result.rotations])
              print("attempts=", [(item.kind, item.status.value, item.message) for item in result.attempts])
          PY
