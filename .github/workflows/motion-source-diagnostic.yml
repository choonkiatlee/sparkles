name: motion-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect D360 public bootstrap
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*"}
          for item in ("79-BB-5159600","79-BT-5165227"):
              url=f"https://media.d360.us/imaged/{item}/0.json"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                      raw=r.read()
                  data=json.loads(raw)
                  print("item=",item)
                  print("sha256=",hashlib.sha256(raw).hexdigest(),"bytes=",len(raw))
                  print("keys=",sorted(data.keys()))
                  print("scramble=",repr(data.get("scramble")))
                  print("dimensions=",data.get("width"),data.get("height"),"version=",data.get("version"),"quality=",data.get("quality"))
              except Exception as exc:
                  print("item=",item,"error=",type(exc).__name__,str(exc))
          PY
