name: motion-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact-certificate Loupe360 media lookup
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://g.nivoda.com/graphql-public-loupe360"
          query='''query($cert:String!){
            certificate_by_cert_number(cert_number:$cert) {
              id certNumber lab image video pdfUrl
              v360 { url frame_count top_index id }
            }
          }'''
          body=json.dumps({"query":query,"variables":{"cert":"LG836619414"}}).encode()
          req=urllib.request.Request(
              url,data=body,method="POST",
              headers={
                  "User-Agent":"Mozilla/5.0 SparklesIssue100/1",
                  "Accept":"application/json",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.loads(r.read())
          print("lookup=",json.dumps(data,sort_keys=True))
          PY
