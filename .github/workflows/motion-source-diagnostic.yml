name: motion-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decode public player constants and metadata shape
        run: |
          python - <<'PY'
          import json, re, urllib.request
          headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*"}
          metadata_url="https://vision.diajewel360.com/imaged/PD-249203/0.json"
          script_url="https://vision.diajewel360.com/js/vision360.js"
          with urllib.request.urlopen(urllib.request.Request(metadata_url,headers=headers),timeout=20) as r:
              metadata=json.load(r)
          with urllib.request.urlopen(urllib.request.Request(script_url,headers=headers),timeout=20) as r:
              script=r.read().decode("utf-8","replace")
          print("metadata_scramble=", metadata["scramble"])
          marker="var _0xb946=["
          start=script.find(marker)
          if start < 0:
              raise SystemExit("string table not found")
          cursor=start+len("var _0xb946=")
          depth=0
          quote=None
          escaped=False
          end=None
          for i,ch in enumerate(script[cursor:],cursor):
              if quote:
                  if escaped: escaped=False
                  elif ch=="\\": escaped=True
                  elif ch==quote: quote=None
                  continue
              if ch in ("'", '"'): quote=ch
              elif ch=="[": depth+=1
              elif ch=="]":
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          table_text=script[cursor:end]
          encoded=re.findall(r'"((?:\\.|[^"\\])*)"',table_text)
          values=[bytes(x,"utf-8").decode("unicode_escape") for x in encoded]
          print("table_len=",len(values))
          for i in range(285,346):
              if i < len(values):
                  print(f"b946[{i}]={values[i]!r}")
          for token in ("_0xc8cexba=", "_0xc8cexc1=", "_0xc8cexc4="):
              pos=0
              count=0
              while True:
                  pos=script.find(token,pos)
                  if pos<0: break
                  print(f"--- {token} occurrence {count} @{pos} ---")
                  print(script[max(0,pos-900):min(len(script),pos+1800)])
                  pos+=len(token)
                  count+=1
                  if count>=5: break
          PY
