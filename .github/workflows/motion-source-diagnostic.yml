name: motion-source-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract Core360 player transport constants
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://v3603703.v360.in/js/vision360.js"
          viewer="https://v3603703.v360.in/vision360.html?d=NGS-05-413"
          req=urllib.request.Request(
              url,
              headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*","Referer":viewer},
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              body=response.read().decode("utf-8","replace")
          print("bytes=",len(body))
          for needle in ("imaged","0.json",".json","version=","data/1","data1","v360.in"):
              positions=[m.start() for m in re.finditer(re.escape(needle),body,re.I)]
              print("needle=",needle,"positions=",positions[:30])
              for pos in positions[:8]:
                  print("CONTEXT",pos)
                  print(body[max(0,pos-1500):min(len(body),pos+3000)])
          literals=re.findall(r'["\']([^"\']{1,300})["\']',body)
          interesting=[
              value for value in literals
              if any(token in value.lower() for token in ("imaged","json","version","data/","http","vision360"))
          ]
          print("interesting_literals_count=",len(interesting))
          for value in interesting[:200]:
              print("LITERAL",repr(value))
          PY
