name: motion-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect audited progressive bootstraps
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*"}
          targets=[
              ("diajewel-LG756580087","https://vision.diajewel360.com/imaged/VL-131355/0.json"),
              ("workshop-LG756520111","https://data1.360view.link/data/1/imaged/2612250-YK-808/0.json?version="),
          ]
          for name,url in targets:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                      raw=r.read()
                  data=json.loads(raw)
                  print("name=",name)
                  print("sha256=",hashlib.sha256(raw).hexdigest(),"bytes=",len(raw))
                  print("dimensions=",data.get("width"),data.get("height"))
                  print("version=",data.get("version"),"quality=",data.get("quality"))
                  print("scramble=",repr(data.get("scramble")))
              except Exception as exc:
                  print("name=",name,"error=",type(exc).__name__,str(exc))
          PY
