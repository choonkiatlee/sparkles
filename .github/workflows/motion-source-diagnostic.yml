name: motion-source-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Core360 bootstrap format
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          viewer="https://v3603703.v360.in/vision360.html?d=NGS-05-413"
          root="https://v3603703.v360.in/imaged/NGS-05-413"
          headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*","Referer":viewer}
          for url in (root+"/0.json?version=",):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read()
              data=json.loads(raw)
              print("url=",url)
              print("sha256=",hashlib.sha256(raw).hexdigest(),"bytes=",len(raw))
              print("keys=",sorted(data.keys()))
              print("dimensions=",data.get("width"),data.get("height"))
              print("version=",data.get("version"),"quality=",data.get("quality"))
              scramble=data.get("scramble")
              print("scramble_type=",type(scramble).__name__,"scramble_len=",len(scramble) if isinstance(scramble,str) else None)
              version=data.get("version")
              batch_url=f"{root}/1.json?version={version}"
              req2=urllib.request.Request(batch_url,headers=headers)
              with urllib.request.urlopen(req2,timeout=20) as response:
                  batch_raw=response.read()
              batch=json.loads(batch_raw)
              print("batch1_url=",batch_url,"count=",len(batch) if isinstance(batch,list) else None,"bytes=",len(batch_raw))
          PY
