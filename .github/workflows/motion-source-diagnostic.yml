name: motion-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect public Loupe360 GraphQL schema entry
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://g.nivoda.com/graphql-public-loupe360"
          query='''{ __type(name: "Query") { fields { name args { name type { kind name ofType { kind name } } } } } }'''
          body=json.dumps({"query":query}).encode()
          req=urllib.request.Request(
              url,
              data=body,
              headers={
                  "User-Agent":"Mozilla/5.0 SparklesIssue100/1",
                  "Accept":"application/json",
                  "Content-Type":"application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read()
              data=json.loads(raw)
              fields=((data.get("data") or {}).get("__type") or {}).get("fields") or []
              matches=[field for field in fields if "certificate" in field.get("name","").lower()]
              print("certificate_fields=",json.dumps(matches,sort_keys=True))
              print("errors=",json.dumps(data.get("errors"),sort_keys=True))
          except Exception as exc:
              print("error=",type(exc).__name__,str(exc))
          PY
