name: motion-source-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/motion-source-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode Core360 player string table
        run: |
          python - <<'PY'
          import codecs, re, urllib.request
          url="https://v3603703.v360.in/js/vision360.js"
          viewer="https://v3603703.v360.in/vision360.html?d=NGS-05-413"
          req=urllib.request.Request(
              url,
              headers={"User-Agent":"Mozilla/5.0 SparklesIssue100/1","Accept":"*/*","Referer":viewer},
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              body=response.read().decode("utf-8","replace")
          start=body.find("var _0xc0fe=[")
          end=body.find("];var dno=",start)
          print("table_bounds=",start,end)
          table=body[start:end]
          raw_values=re.findall(r'"((?:\\.|[^"\\])*)"',table)
          values=[]
          for raw in raw_values:
              try:
                  values.append(codecs.decode(raw,"unicode_escape"))
              except Exception:
                  values.append(raw)
          print("table_entries=",len(values))
          interesting=("imaged","json","version","data/","http","vision360","scramble",".jpg")
          for index,value in enumerate(values):
              if any(token in value.lower() for token in interesting):
                  print("ENTRY",index,repr(value))
          for index in range(40,min(100,len(values))):
              print("CORE",index,repr(values[index]))
          PY
