name: R07 R23 original source audit

on:
  pull_request:
    paths:
      - "tools/reference_motion_source_audit.py"
      - "tests/test_reference_motion_source_audit.py"
      - ".github/workflows/reference-r07-r23-original-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository
        run: python -m pip install -e .
      - name: Network-free R07 / R23 regression tests
        run: python -m unittest tests.test_reference_motion_source_audit -v
      - name: Exact R07 V360 buyer viewer (one read, no crawl or publish)
        timeout-minutes: 3
        run: python tools/reference_motion_source_audit.py r07
      - name: Exact R23 D360 original-source preflight and conditional full verification
        timeout-minutes: 9
        run: python tools/reference_motion_source_audit.py r23
