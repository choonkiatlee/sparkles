name: asscher-geometry-validation-contract

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_validation.py"
      - "diamond360/asscher_wireframe.py"
      - "diamond360/asscher_topology.py"
      - "diamond360/asscher_sequence_gauge.py"
      - "docs/360/benchmark/source-bundles.json"
      - "docs/360/asscher-geometry-validation/**"
      - "tests/test_asscher_geometry_validation.py"
      - ".github/workflows/asscher-geometry-validation-contract.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run frozen geometry validation contract tests
        run: python -m unittest tests.test_asscher_geometry_validation -v

      - name: Record full-suite status
        continue-on-error: true
        run: python -m unittest discover -s tests -v
