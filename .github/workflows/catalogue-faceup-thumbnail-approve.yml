name: catalogue-faceup-thumbnail-approve

on:
  workflow_dispatch:
    inputs:
      diamond_id:
        description: "Stable ID from reviewed preview bundle"
        required: true
        type: string
      approved_image_sha:
        description: "Exact approved WebP SHA-256 from the preview JSON"
        required: true
        type: string
      approved_source_sha:
        description: "Exact original frame SHA-256 from the preview JSON"
        required: true
        type: string
      manual_review_ack:
        description: "Type I_REVIEWED_THE_CROWN_VIEW after visually checking crown vs pavilion"
        required: true
        type: string

permissions: {}

concurrency:
  group: sparkles-diamond-catalogue-master-publisher
  cancel-in-progress: false

jobs:
  approve-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Reproduce approved image, verify hashes, upload and atomically publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/master
          GITHUB_ACTOR: ${{ github.actor }}
          DIAMOND_ID: ${{ inputs.diamond_id }}
          IMAGE_SHA: ${{ inputs.approved_image_sha }}
          SOURCE_SHA: ${{ inputs.approved_source_sha }}
          REVIEW_ACK: ${{ inputs.manual_review_ack }}
        run: |
          python -m diamond_catalogue.faceup_publish_cli \
            --diamond-id "$DIAMOND_ID" \
            --approved-image-sha "$IMAGE_SHA" \
            --approved-source-sha "$SOURCE_SHA" \
            --manual-review-ack "$REVIEW_ACK"

  deploy-pages:
    needs: approve-and-publish
    uses: ./.github/workflows/catalogue-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
