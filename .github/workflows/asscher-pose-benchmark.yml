name: asscher-pose-benchmark

concurrency:
  group: asscher-pose-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "diamond360/geometry.py"
      - "diamond360/normalized_geometry.py"
      - "diamond360/asscher_pose.py"
      - "diamond360/asscher_sequence_gauge.py"
      - "diamond360/asscher_pose_sequence.py"
      - "diamond360/asscher_pose_benchmark.py"
      - "diamond360/qc.py"
      - "tests/test_asscher_outline.py"
      - "tests/test_asscher_pose.py"
      - "tests/test_asscher_sequence_gauge.py"
      - "tests/test_asscher_pose_sequence.py"
      - "tests/test_normalized_geometry.py"
      - ".github/workflows/asscher-pose-benchmark.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run issue 73 and 80 tests
        run: |
          python -m unittest \
            tests.test_asscher_outline \
            tests.test_normalized_geometry \
            tests.test_asscher_pose \
            tests.test_asscher_sequence_gauge \
            tests.test_asscher_pose_sequence -v

      - name: Record full-suite status
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Download benchmark source bundles
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          root = Path("outputs/asscher-pose-sources")
          root.mkdir(parents=True, exist_ok=True)

          for item in manifest["bundles"]:
              archive = root / item["filename"]
              urllib.request.urlretrieve(item["download_url"], archive)
              assert archive.stat().st_size == item["bytes"]
              assert (
                  hashlib.sha256(archive.read_bytes()).hexdigest()
                  == item["sha256"]
              )
              destination = root / item["certificate"]
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(destination)
          PY

      - name: Run four-stone pose benchmark
        run: |
          python -m diamond360.asscher_pose_benchmark \
            --source-root outputs/asscher-pose-sources \
            --output outputs/asscher-pose-benchmark

      - name: Print benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("outputs/asscher-pose-benchmark/summary.json").read_text()
          )
          for stone in data["stones"]:
              print(stone["certificate"])
              print("  status:", stone["status_counts"])
              print("  sequence coordinate:", stone["sequence_coordinate"])
              print(
                  "  top:",
                  [
                      (row["source_index"], round(row["score"], 3))
                      for row in stone["top_candidates"][:8]
                  ],
              )
              print("  borderline:", stone["borderline_usable"])
              print("  first rejected:", stone["first_rejected"])
          PY

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: asscher-pose-benchmark
          path: outputs/asscher-pose-benchmark
          if-no-files-found: error
          retention-days: 90
