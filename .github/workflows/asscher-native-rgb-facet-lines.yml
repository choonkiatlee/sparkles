name: asscher-native-RGB-facet-line-diagnostic

concurrency:
  group: asscher-native-RGB-facet-line-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_rgb_lines.py"
      - "tests/test_asscher_geometry_rgb_lines.py"
      - "docs/360/asscher-geometry-validation/NATIVE-RGB-FACET-LINES.md"
      - ".github/workflows/asscher-native-rgb-facet-lines.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Test independent RGB lines and frozen-contract isolation
        run: |
          python -m unittest \
            tests.test_asscher_geometry_rgb_lines \
            tests.test_asscher_geometry_inner_evidence_diagnostic \
            tests.test_asscher_geometry_validation -v

      - name: Fetch immutable #96 outer-octagon baseline
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-outer-v2

      - name: Retrieve original camera-RGB source rotations with frozen SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          root = Path("outputs/native-RGB-facet-line-sources")
          root.mkdir(parents=True, exist_ok=True)
          for row in manifest["bundles"]:
              archive = root / row["filename"]
              urllib.request.urlretrieve(row["download_url"], archive)
              assert archive.stat().st_size == row["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == row["sha256"]
              dest = root / row["certificate"]
              dest.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Extract independent native-RGB facet line and corner candidates
        run: |
          python -m diamond360.asscher_geometry_rgb_lines \
            --source-root outputs/native-RGB-facet-line-sources \
            --output outputs/asscher-native-RGB-facet-lines

      - name: Verify four-stone crown view selection is frozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/asscher-native-RGB-facet-lines")
          report=json.loads((root/"summary.json").read_text())
          assert len(report["stones"])==4
          assert not report["method_change"]
          for row in report["stones"]:
              cert=row["certificate"]
              before=json.loads((Path("outputs/frozen-outer-v2/per-stone")
                                 /cert/"primary-wireframe.json").read_text())
              expected=[s["source_index"] for s in before["selected_frames"]]
              assert row["selected_source_indices"]==expected,(cert,expected)
              assert (root/"per-stone"/cert/"line-evidence.json").exists()
              print(cert, "source indices", expected,
                    "candidate polygon frames",row["polygon_candidate_frame_count"],
                    "QC",row["QC_contact_sheet"])
          PY

      - name: Upload complete RGB line evidence with abstentions
        uses: actions/upload-artifact@v4
        with:
          name: asscher-native-RGB-facet-line-diagnostic
          path: outputs/asscher-native-RGB-facet-lines
          retention-days: 90
          if-no-files-found: error
