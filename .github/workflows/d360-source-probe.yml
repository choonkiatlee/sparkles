name: d360 source probe

on:
  pull_request:
    paths:
      - ".github/workflows/d360-source-probe.yml"
      - "diamond360/d360_source.py"
      - "tests/test_d360_source.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe d360 pack structure
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib, json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          IDS=["79-BB-5159600","79-BT-5165227"]
          UA="Mozilla/5.0 SparklesD360Probe/3"

          def get(url):
              req=Request(url,headers={"User-Agent":UA,"Accept":"*/*","Referer":"https://d360.tech/"})
              with urlopen(req,timeout=30) as r:
                  return r.read(),dict(r.headers),r.status

          def summarize(v,depth=0):
              if depth>3:return type(v).__name__
              if isinstance(v,dict):
                  return {k:summarize(x,depth+1) for k,x in list(v.items())[:30]}
              if isinstance(v,list):
                  return {"type":"list","len":len(v),"first":[summarize(x,depth+1) for x in v[:3]]}
              if isinstance(v,str):
                  return {"type":"str","len":len(v),"prefix":v[:80]}
              return v

          for item in IDS:
              base=f"https://media.d360.us/imaged/{item}"
              print("ITEM",item)
              for name in ["metadata.json","0.json","1.json","2.json","3.json","4.json","5.json","6.json","7.json","8.json","still.jpg"]:
                  url=f"{base}/{name}"
                  try:
                      data,h,status=get(url)
                      print("RESOURCE",name,"status",status,"bytes",len(data),"sha256",hashlib.sha256(data).hexdigest(),"type",h.get("Content-Type"))
                      if name.endswith(".json"):
                          try:
                              obj=json.loads(data)
                              print("JSON_SUMMARY",name,json.dumps(summarize(obj),sort_keys=True))
                          except Exception as exc:
                              print("JSON_PARSE_ERROR",name,repr(exc),"prefix",data[:200])
                  except HTTPError as exc:
                      print("RESOURCE",name,"status",exc.code)
                  except Exception as exc:
                      print("RESOURCE",name,"error",repr(exc))
          PY
