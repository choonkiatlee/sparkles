name: d360 source integration

on:
  pull_request:
    paths:
      - ".github/workflows/d360-source-probe.yml"
      - "diamond360/d360_source.py"
      - "tests/test_d360_source.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install project and test dependency
        run: python -m pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q tests/test_d360_source.py

      - name: Extract Karl-labelled d360 sources
        run: |
          python -m diamond360.d360_source 79-BB-5159600 /tmp/d360/79-BB-5159600
          python -m diamond360.d360_source 79-BT-5165227 /tmp/d360/79-BT-5165227

      - name: Validate Sparkles source contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from diamond360.ingestion import ingest

          for item in ("79-BB-5159600", "79-BT-5165227"):
              root = Path("/tmp/d360") / item
              manifest = root / "source-manifest.json"
              result = ingest(root, manifest)
              assert result["frame_count"] == 256
              assert result["valid_count"] == 256
              assert not result["sparse"]
              assert result["ordering"] == "explicit_manifest"
              source = json.loads(manifest.read_text())
              print(json.dumps({
                  "item_id": item,
                  "frame_count": result["frame_count"],
                  "dimensions": result["dimensions"],
                  "metadata_sha256": source["metadata_sha256"],
                  "bootstrap_sha256": source["bootstrap_sha256"],
                  "first_frame_sha256": source["frames"][0]["sha256"],
                  "last_frame_sha256": source["frames"][-1]["sha256"],
              }, sort_keys=True))
          PY

      - name: Upload extracted sources
        uses: actions/upload-artifact@v4
        with:
          name: d360-karl-labelled-sources
          path: /tmp/d360
          if-no-files-found: error
          retention-days: 7
