name: d360 source probe

on:
  pull_request:
    paths:
      - ".github/workflows/d360-source-probe.yml"
      - "diamond360/d360_source.py"
      - "tests/test_d360_source.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm d360 scramble key
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from pathlib import Path
          ids=["79-BB-5159600","79-BT-5165227"]
          for item in ids:
              url=f"https://media.d360.us/imaged/{item}/0.json"
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0 SparklesD360Probe/5","Referer":"https://d360.tech/"}),timeout=30) as r:
                  data=json.load(r)
              Path(f"/tmp/{item}.scramble").write_text(data["scramble"])
          PY
          node - <<'JS'
          const fs=require("fs"),crypto=require("crypto");
          const key=Buffer.from("2606198511121984","utf8");
          for(const id of ["79-BB-5159600","79-BT-5165227"]){
            const enc=Buffer.from(fs.readFileSync("/tmp/"+id+".scramble","utf8").replace(/[^A-Za-z0-9+/=]/g,""),"base64");
            const decipher=crypto.createDecipheriv("aes-128-cbc",key,key);
            decipher.setAutoPadding(false);
            const raw=Buffer.concat([decipher.update(enc),decipher.final()]);
            let end=raw.length;
            const pad=raw[raw.length-1];
            if(pad>0 && pad<=16 && raw.slice(-pad).every(x=>x===pad)) end-=pad;
            const txt=raw.slice(0,end).toString("utf8").replace(/\r/g,"");
            console.log("SCRAMBLE",id,txt);
            const obj=JSON.parse(txt);
            console.log("LEVELS",id,obj.map(x=>x.length),"TOTAL",obj.reduce((a,x)=>a+x.length,0));
          }
          JS
