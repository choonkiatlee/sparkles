name: R13 R15 read-only Imgur Chromium attribution audit

on:
  pull_request:
    paths:
      - "tools/audit_r13_r15_imgur_browser.py"
      - "tests/test_r13_r15_imgur_browser.py"
      - ".github/workflows/r13-r15-imgur-browser-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser metadata audit requirements
        run: python -m pip install selenium
      - name: Run network-free attribution and media-blocking guard tests
        run: python -m unittest tests.test_r13_r15_imgur tests.test_r13_r15_imgur_browser -v
      - name: Inspect exactly two Imgur albums via Chrome, with media URLs blocked
        timeout-minutes: 6
        run: python -m tools.audit_r13_r15_imgur_browser --out "$RUNNER_TEMP/r13-r15-imgur-browser.json"
      - name: Retain sanitized, non-binary metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r13-r15-imgur-browser-metadata-only
          path: ${{ runner.temp }}/r13-r15-imgur-browser.json
          retention-days: 30
          if-no-files-found: warn
