name: Issue 51 provenance validation

on:
  pull_request:
    paths:
      - "diamond360/articulation_benchmark.py"
      - "tests/test_articulation_benchmark.py"
      - "docs/360/articulation/**"
      - "docs/360/calibration/**"
      - ".github/workflows/issue-51-provenance-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m unittest -v tests.test_articulation tests.test_articulation_benchmark tests.test_calibration
