name: Issue 45 descriptor profile tests

on:
  push:
    branches:
      - issue-45-descriptor-profile

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m unittest tests.test_descriptor_profile
