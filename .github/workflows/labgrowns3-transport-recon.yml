name: labgrowns3-transport-recon

on:
  pull_request:
    paths:
      - ".github/workflows/labgrowns3-transport-recon.yml"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect two publicly linked viewer contracts (read-only, bounded)
        run: |
          python - <<'PY'
          import html.parser
          import re
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          ROOT="https://labgrowns3.s3.ap-southeast-1.amazonaws.com/"
          PATH="stoneimages360.html"
          HEADERS={"User-Agent":"Sparkles-Media-Contract-Probe/1"}
          def fetch(url):
              parts=urlsplit(url)
              assert parts.scheme=="https" and parts.hostname=="labgrowns3.s3.ap-southeast-1.amazonaws.com" and not parts.username
              with urllib.request.urlopen(urllib.request.Request(url,headers=HEADERS),timeout=12) as response:
                  data=response.read(500_001)
                  print("STATUS",response.status,"TYPE",response.headers.get("Content-Type"),"BYTES",len(data),"URL",response.url)
              assert len(data)<=500_000
              return data.decode("utf-8","replace")
          class Tags(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__();self.refs=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","img","iframe","video","source","link"):
                      for k,v in attrs:
                          if k in ("src","href","data-src"):
                              self.refs.append((tag,k,v))
          for item in ("1210811_B2C","1165252_B2C"):
              print("\n==== VIEWER",item,"====",flush=True)
              try:
                  page=fetch(ROOT+PATH+"?d="+item)
                  print("HTML FIRST 16000:\n",page[:16000],flush=True)
                  tags=Tags();tags.feed(page)
                  print("RESOURCES",tags.refs[:40],flush=True)
                  for tag,_,src in tags.refs[:10]:
                      if tag=="script" and src.lower().split("?")[0].endswith(".js"):
                          url=urljoin(ROOT+PATH,src)
                          if urlsplit(url).hostname == urlsplit(ROOT).hostname:
                              try:
                                  body=fetch(url)
                                  print("SCRIPT",src,"HEAD",body[:12000],flush=True)
                              except Exception as exc: print("JS ERROR",type(exc).__name__,flush=True)
              except Exception as exc:
                  print("VIEWER ERROR",type(exc).__name__,str(exc)[:200],flush=True)
          PY
          python - <<'PY'
          import urllib.request
          url="https://labgrowns3.s3.ap-southeast-1.amazonaws.com/js/KVideo.min.js"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Sparkles-Protocol-Audit/1"}),timeout=15) as resp:
              data=resp.read(3_000_001)
          assert len(data)<=3_000_000
          open("/tmp/kv-lab.js","wb").write(data)
          print("Audited public KVideo source bytes:",len(data))
          PY
          node - <<'JS'
          const fs=require("node:fs"),vm=require("node:vm");
          const s=fs.readFileSync("/tmp/kv-lab.js","utf8");
          const anchor="var _0x3e0e=";
          const first=s.indexOf(anchor);
          if(first<0)throw Error("Static player array missing");
          let end=-1,depth=0,quote="",escaped=false;
          const begin=first+anchor.length;
          for(let i=begin;i<s.length;i++){
            const ch=s[i];
            if(escaped){escaped=false;continue}
            if(quote){if(ch==="\\\\")escaped=true;else if(ch===quote)quote="";continue}
            if(ch==='"'||ch==="'"){quote=ch;continue}
            if(ch==="[")depth++;
            if(ch==="]"){depth--;if(depth===0){end=i;break}}
          }
          console.log("LITERAL_OFFSETS",first,end,"bytes",end-first);
          if(end<first||end-first>530000)throw Error("Literal array unclosed or unexpectedly large");
          const literal=s.slice(begin,end+1);
          let arr;
          try {arr=vm.runInNewContext("("+literal+")",Object.create(null),{timeout:300})}
          catch(err){console.log("ARRAY_ERROR",err.name,err.message);process.exit(1)}
          if(!Array.isArray(arr)||!arr.every(x=>typeof x==="string"))throw Error("Not a string table");
          console.log("CONST_TABLE_LENGTH",arr.length);
          for(const [from,to] of [[0,30],[135,155],[370,415]]){
            for(let i=from;i<Math.min(to,arr.length);i++)console.log("CONST",i,JSON.stringify(arr[i]).slice(0,300));
          }
          for(const token of ["_0x3e0e[376]","_0x3e0e[377]","_0x3e0e[382]"]){
            let start=0,count=0;
            while((start=s.indexOf(token,start))>=0&&count++<8){
              console.log("USE",token,s.slice(Math.max(0,start-100),Math.min(s.length,start+230)).slice(0,330));
              start+=token.length;
            }
          }
          JS
