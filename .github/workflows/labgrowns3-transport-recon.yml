name: labgrowns3-transport-recon

on:
  pull_request:
    paths:
      - ".github/workflows/labgrowns3-transport-recon.yml"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect two publicly linked viewer contracts (read-only, bounded)
        run: |
          python - <<'PY'
          import html.parser
          import re
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          ROOT="https://labgrowns3.s3.ap-southeast-1.amazonaws.com/"
          PATH="stoneimages360.html"
          HEADERS={"User-Agent":"Sparkles-Media-Contract-Probe/1"}
          def fetch(url):
              parts=urlsplit(url)
              assert parts.scheme=="https" and parts.hostname=="labgrowns3.s3.ap-southeast-1.amazonaws.com" and not parts.username
              with urllib.request.urlopen(urllib.request.Request(url,headers=HEADERS),timeout=12) as response:
                  data=response.read(500_001)
                  print("STATUS",response.status,"TYPE",response.headers.get("Content-Type"),"BYTES",len(data),"URL",response.url)
              assert len(data)<=500_000
              return data.decode("utf-8","replace")
          class Tags(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__();self.refs=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","img","iframe","video","source","link"):
                      for k,v in attrs:
                          if k in ("src","href","data-src"):
                              self.refs.append((tag,k,v))
          for item in ("1210811_B2C","1165252_B2C"):
              print("\n==== VIEWER",item,"====",flush=True)
              try:
                  page=fetch(ROOT+PATH+"?d="+item)
                  print("HTML FIRST 16000:\n",page[:16000],flush=True)
                  tags=Tags();tags.feed(page)
                  print("RESOURCES",tags.refs[:40],flush=True)
                  for tag,_,src in tags.refs[:10]:
                      if tag=="script" and src.lower().split("?")[0].endswith(".js"):
                          url=urljoin(ROOT+PATH,src)
                          if urlsplit(url).hostname == urlsplit(ROOT).hostname:
                              try:
                                  body=fetch(url)
                                  print("SCRIPT",src,"HEAD",body[:12000],flush=True)
                              except Exception as exc: print("JS ERROR",type(exc).__name__,flush=True)
              except Exception as exc:
                  print("VIEWER ERROR",type(exc).__name__,str(exc)[:200],flush=True)
          PY
          python - <<'PY'
          import re,urllib.request
          ROOT="https://labgrowns3.s3.ap-southeast-1.amazonaws.com/"
          url=ROOT+"js/KVideo.min.js"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Sparkles-Media-Contract-Probe/1"}),timeout=15) as response:
              data=response.read(3_000_001)
          print("=== KVIDEO SIZE",len(data),"===")
          if len(data)>3_000_000: raise SystemExit("JS too large")
          js=data.decode("utf-8","replace")
          pats=(r'\\.jpg',r'\\.json',r'\\.png',r'\\.mp4',r'images',r'imaged',r'frames?',r'surl',r'movieName',r'getParameter',r'KVideo',r'\.ajax',r'GetQueryString',r'location.search',r'\.post',r'fetch\\(',r'\\.get\\(')
          for pat in pats:
              hits=list(re.finditer(pat,js,re.I))
              print("\nPATTERN",pat,"COUNT",len(hits))
              for match in hits[:12]:
                  print(js[max(0,match.start()-150):min(len(js),match.end()+200)].replace("\\n"," ")[:380])
          PY
