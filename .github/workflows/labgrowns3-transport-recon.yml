name: labgrowns3-transport-recon

on:
  pull_request:
    paths:
      - ".github/workflows/labgrowns3-transport-recon.yml"
      - "diamond_retrieval/motion_sources.py"
      - "diamond_retrieval/composition.py"
      - "tests/test_diamond_retrieval_motion.py"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Full 256-frame original rotation audit for both accepted reference stones
        run: |
          python - <<'PY'
          from diamond_retrieval import (
              ROTATION, EvidenceReference, Labgrowns3RotationDownloader,
              ProgressiveRotationProcessor, UrllibHttpClient,
          )
          downloader=Labgrowns3RotationDownloader(UrllibHttpClient(max_bytes=16*1024*1024),timeout=20)
          processor=ProgressiveRotationProcessor()
          root="https://labgrowns3.s3.ap-southeast-1.amazonaws.com/stoneimages360.html?d="
          for ref_id,item in (
              ("ps285166-r06","1210811_B2C"),
              ("ps285166-r10","1165252_B2C"),
          ):
              url=root+item
              ref=EvidenceReference(identifier=ref_id,kind=ROTATION,retrieval_key=url,locator=url)
              raw=downloader.download(ref)
              evidence=processor.process(raw)[0]
              frames=evidence.frames
              print("REFERENCE",ref_id,"frame count",len(frames),"dimensions",evidence.metadata.get("dimensions"),"source version",raw.metadata.get("source_version"),"first_sha256",frames[0].sha256,flush=True)
              assert len(frames)==256
              assert [f.source_index for f in frames]==list(range(256))
              assert evidence.metadata["sequence_complete"]
              assert len({f.sha256 for f in frames})>=200
          PY
