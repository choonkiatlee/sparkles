name: Issue 51 benchmark validation

on:
  pull_request:
    paths:
      - "diamond360/articulation.py"
      - "diamond360/articulation_benchmark.py"
      - "tests/test_articulation.py"
      - "tests/test_articulation_benchmark.py"
      - "docs/360/articulation/**"
      - ".github/workflows/issue-51-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Unit tests
        run: python -m unittest -v tests.test_articulation tests.test_articulation_benchmark

      - name: Recover canonical benchmark sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bundles /tmp/sources /tmp/extract
          gh release download benchmark-sources-v1 --repo "${{ github.repository }}" --pattern "*benchmark-full-sequence.zip" --dir /tmp/bundles
          for archive in /tmp/bundles/*-benchmark-full-sequence.zip; do
            name="$(basename "$archive" -benchmark-full-sequence.zip)"
            scratch="/tmp/extract/$name"
            destination="/tmp/sources/$name"
            mkdir -p "$scratch" "$destination"
            unzip -q "$archive" -d "$scratch"
            manifest="$(find "$scratch" -name source-manifest.json -print -quit)"
            test -n "$manifest"
            root="$(dirname "$manifest")"
            cp -a "$root"/. "$destination"/
          done

      - name: Load current issue 49 comparison
        run: |
          git fetch origin issue-49-tier-contrast
          git show origin/issue-49-tier-contrast:docs/360/tier-contrast/summary.json > /tmp/tier-contrast.json

      - name: Four-stone benchmark on exact canonical windows
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          from diamond360 import articulation_benchmark as arb
          from diamond360 import benchmark
          from diamond360.pipeline import run as preprocess

          manifest_path = Path("docs/360/benchmark/benchmark.json").resolve()
          manifest = benchmark.validate_manifest(json.loads(manifest_path.read_text()))
          source_root = Path("/tmp/sources")
          sparse_root = Path("/tmp/sparse")
          processed_root = Path("/tmp/processed")
          output = Path("/tmp/issue51-benchmark")
          results = {}

          for stone in manifest["stones"]:
              if stone["source_status"] != "complete":
                  continue
              cert = stone["certificate"]
              full_source = source_root / cert
              source_manifest = json.loads((full_source / "source-manifest.json").read_text())
              wide = benchmark.cyclic_window(
                  stone["faceup_center"], manifest["wide_window"], stone["source_frame_count"]
              )
              wanted = set(wide)

              sparse = sparse_root / cert
              (sparse / "frames").mkdir(parents=True, exist_ok=True)
              kept = []
              for frame in source_manifest["frames"]:
                  if frame["source_index"] not in wanted:
                      continue
                  src = full_source / frame["path"]
                  dst = sparse / frame["path"]
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  kept.append(frame)
              derived = dict(source_manifest)
              derived["frames"] = kept
              derived["sequence_complete"] = False
              (sparse / "source-manifest.json").write_text(
                  json.dumps(derived, indent=2, allow_nan=False) + "\n"
              )

              processed = processed_root / cert
              processed.parent.mkdir(parents=True, exist_ok=True)
              preprocess(
                  sparse,
                  processed,
                  order_manifest=sparse / "source-manifest.json",
                  gain=1.0,
                  diagnostic_indices=wide,
                  accept_review=True,
              )

              results[cert] = {}
              for window, size in (("core", manifest["core_window"]), ("wide", manifest["wide_window"])):
                  indices = benchmark.cyclic_window(
                      stone["faceup_center"], size, stone["source_frame_count"]
                  )
                  wrap = any(b < a for a, b in zip(indices, indices[1:]))
                  result = arb.measure_stone(processed, indices, wrap=wrap)
                  arb.write_stone_outputs(
                      result, output / "per-stone" / cert / window, processed=processed
                  )
                  results[cert][window] = result

          profile = json.loads(Path("docs/360/profile/comparison.json").read_text())
          observations = json.loads(Path("docs/360/calibration/human-observations.json").read_text())
          tier = json.loads(Path("/tmp/tier-contrast.json").read_text())
          summary = arb.build_benchmark_summary(
              results, profile=profile, tier_contrast=tier, observations=observations
          )
          arb.write_benchmark_summary(summary, output)
          print(json.dumps({
              "stones": sorted(results),
              "rows": len(summary["rows"]),
              "disposition": summary["disposition"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: issue51-benchmark
          path: /tmp/issue51-benchmark
          if-no-files-found: error
