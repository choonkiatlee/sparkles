name: Audit LG788643234 Nivoda original frames

on:
  pull_request:
    paths:
      - ".github/workflows/lg788643234-nivoda-audit.yml"

permissions:
  contents: read

jobs:
  inspect-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect certificate-linked Nivoda metadata and actual source format (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          report = "LG788643234"
          endpoint = "https://g.nivoda.com/graphql-public-loupe360"
          expected = "https://nivoda-inhousemedia.s3.amazonaws.com/inhouse-360-788643234"
          query = (
              "query($cert:String!){certificate_by_cert_number(cert_number:$cert)"
              "{certNumber lab image video v360{url frame_count top_index id}}}"
          )
          req = urllib.request.Request(
              endpoint,
              data=json.dumps({"query": query, "variables": {"cert": report}}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          print("report=", report)
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  payload = json.load(response)
              data = (payload.get("data") or {}).get("certificate_by_cert_number") or {}
              print("certificate_matches=", data.get("certNumber") == report)
              print("lab=", data.get("lab"))
              print("image_field_type=", type(data.get("image")).__name__)
              print("video_field_type=", type(data.get("video")).__name__)
              v = data.get("v360") or {}
              wrapped = v.get("url") or ""
              parts = urllib.parse.urlsplit(wrapped)
              if parts.hostname == "assets-images.pixorac.com":
                  encoded = parts.path.strip("/").split("/")[0]
                  try:
                      resolved = base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)).decode()
                  except Exception:
                      resolved = "<invalid wrapper>"
              else:
                  resolved = wrapped
              print("v360_frame_count=", v.get("frame_count"))
              print("v360_top_index=", v.get("top_index"))
              print("v360_wrapper_host=", parts.hostname)
              print("exact_v360_source_matches=", resolved == expected)
              print("v360_source_host=", urllib.parse.urlsplit(resolved).hostname)
              print("v360_source_path=", urllib.parse.urlsplit(resolved).path)
              print("metadata_contains_indexed_jpeg_urls=", any(
                  isinstance(x, str) and ".jpg" in x.lower()
                  for x in [wrapped, resolved, data.get("video")]
              ))
          except Exception as exc:
              print("certificate_lookup_error=", type(exc).__name__, str(exc)[:250])

          # Only the certificate-linked, already recorded S3 URL is contacted:
          # no guessed sibling keys, directory traversal, sample video download
          # or image extraction from compressed video.
          for method in ("HEAD", "GET"):
              headers = {"Accept-Encoding": "identity"}
              if method == "GET":
                  headers["Range"] = "bytes=0-63"
              req = urllib.request.Request(expected, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      buf = response.read(64) if method == "GET" else b""
                      print(method, "status=", response.status,
                            "type=", response.headers.get("Content-Type"),
                            "length=", response.headers.get("Content-Length"),
                            "content_range=", response.headers.get("Content-Range"),
                            "final_host=", urllib.parse.urlsplit(response.url).hostname)
                      if buf:
                          signature = ("mp4-ftyp" if buf[4:8] == b"ftyp" else
                                       "jpeg-soi" if buf[:3] == b"\xff\xd8\xff" else
                                       "other")
                          print("source_signature=", signature)
              except urllib.error.HTTPError as exc:
                  print(method, "http_status=", exc.code,
                        "type=", exc.headers.get("Content-Type"))
              except Exception as exc:
                  print(method, "error=", type(exc).__name__, str(exc)[:180])
          PY

      - name: Probe only certificate-matched Pixorac JPEG cache (never decode MP4)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json
          import urllib.error, urllib.parse, urllib.request
          report = "LG788643234"
          expected = "https://nivoda-inhousemedia.s3.amazonaws.com/inhouse-360-788643234"
          endpoint = "https://g.nivoda.com/graphql-public-loupe360"
          query = ("query($cert:String!){certificate_by_cert_number(cert_number:$cert)"
                   "{certNumber lab v360{url frame_count top_index}}}")
          req = urllib.request.Request(
              endpoint,
              data=json.dumps({"query":query,"variables":{"cert":report}}).encode(),
              headers={"Content-Type":"application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)["data"]["certificate_by_cert_number"]
              v = data["v360"]
              root = v["url"].rstrip("/")
              p = urllib.parse.urlsplit(root)
              assert data["certNumber"] == report and p.scheme == "https"
              assert p.netloc == "assets-images.pixorac.com"
              assert not p.query and not p.fragment
              encoded = p.path.strip("/")
              assert "/" not in encoded and 20 < len(encoded) <= 1024
              decoded = base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)).decode()
              assert decoded == expected and v["frame_count"] == 256
              print("cache_source_proof= exact-certificate wrapped MP4")
          except Exception as exc:
              print("cache_provenance_failed=", type(exc).__name__, str(exc)[:160])
              raise SystemExit(0)

          def get_frame(i):
              url = root + "/" + str(i) + ".jpg"
              req = urllib.request.Request(url, headers={"Accept-Encoding":"identity"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      content = response.read(1024*1024+1)
                      if response.url != url or len(content) > 1024*1024:
                          return (i, "redirect-or-oversize", "")
                      if response.status != 200 or not content.startswith(b"\xff\xd8\xff") or not content.endswith(b"\xff\xd9"):
                          return (i, "not-jpeg", "")
                      return (i, "jpeg", hashlib.sha256(content).hexdigest())
              except urllib.error.HTTPError as exc:
                  return (i, "http-" + str(exc.code), "")
              except Exception as exc:
                  return (i, type(exc).__name__, "")

          boundary = [0, 1, 127, 254, 255]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              samples = list(pool.map(get_frame, boundary))
          print("sampled_frames=", [(i, status) for i,status,_ in samples])
          if any(status != "jpeg" for _,status,_ in samples):
              print("complete_indexed_proxy_available= false (sample failed)")
              raise SystemExit(0)
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              rest = list(pool.map(get_frame, (i for i in range(256) if i not in boundary)))
          result = samples + rest
          good = [digest for _,status,digest in result if status == "jpeg"]
          failed = [(i,status) for i,status,_ in result if status != "jpeg"]
          print("indexed_jpeg_count=", len(good))
          print("indexed_jpeg_distinct_hashes=", len(set(good)))
          print("failed_indices=", failed[:15])
          print("complete_indexed_proxy_available=", len(good)==256 and len(set(good))>=240)
          print("proxy_originality=not_verified_against_supplier")
          PY

      - name: Probe existing Pixorac browser image format and ordinary headers
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, urllib.error, urllib.parse, urllib.request
          endpoint = "https://g.nivoda.com/graphql-public-loupe360"
          report = "LG788643234"
          exact_source = "https://nivoda-inhousemedia.s3.amazonaws.com/inhouse-360-788643234"
          query = ("query($cert:String!){certificate_by_cert_number(cert_number:$cert)"
                   "{certNumber lab v360{url frame_count top_index}}}")
          request = urllib.request.Request(endpoint, method="POST",
                      data=json.dumps({"query":query,"variables":{"cert":report}}).encode(),
                      headers={"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(request, timeout=12) as response:
                  d=json.load(response)["data"]["certificate_by_cert_number"]
              v=d["v360"]; root=v["url"].rstrip("/")
              p=urllib.parse.urlsplit(root)
              assert d["certNumber"]==report and d["lab"].upper()=="IGI"
              assert p.scheme=="https" and p.netloc=="assets-images.pixorac.com"
              assert p.query=="" and p.fragment=="" and len(p.path)>20 and p.path.count("/")==1
              token=p.path.strip("/")
              decoded=base64.urlsafe_b64decode(token+"="*(-len(token)%4)).decode()
              assert decoded==exact_source and v["frame_count"]==256
          except Exception as exc:
              print("provenance_failed=",type(exc).__name__,str(exc)[:100])
              raise SystemExit(0)
          print("source=certificate-matched-pixorac-mp4-wrapper")
          print("frame_count=", v.get("frame_count"))
          for ext in ("webp","jpg"):
              for i in (0,254):
                  for mode in ("bare","browser"):
                      headers={"Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                               "Accept-Encoding":"identity"}
                      if mode=="browser":
                          headers["User-Agent"]=("Mozilla/5.0 (X11; Linux x86_64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123 Safari/537.36")
                          headers["Referer"]="https://loupe360.com/"
                      url=f"{root}/{i}.{ext}"
                      request=urllib.request.Request(url,headers=headers)
                      try:
                          with urllib.request.urlopen(request,timeout=10) as response:
                              blob=response.read(1024*1024+1)
                              valid=(blob[:4]==b"RIFF" and blob[8:12]==b"WEBP"
                                     if ext=="webp" else blob[:3]==b"\xff\xd8\xff")
                              print(ext,i,mode,"http=",response.status,
                                   "type=",response.headers.get("Content-Type"),
                                   "length=",len(blob),"valid_image=",valid,
                                   "source_host_unchanged=",urllib.parse.urlsplit(response.url).netloc==p.netloc)
                      except urllib.error.HTTPError as exc:
                          print(ext,i,mode,"http=",exc.code)
                      except Exception as exc:
                          print(ext,i,mode,"error=",type(exc).__name__)
          PY
