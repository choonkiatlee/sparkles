name: diamond-retrieval-contract

on:
  pull_request:
    paths:
      - "diamond_retrieval/**"
      - "diamond360/d360_source.py"
      - "tests/test_diamond_retrieval*.py"
      - "tests/test_filesonsky_motion.py"
      - "tests/test_reference_media_lookup.py"
      - "tests/test_d360_source.py"
      - "tests/fixtures/diamond_retrieval/**"
      - "docs/diamond-retrieval.md"
      - "docs/superpowers/plans/**"
      - "pyproject.toml"
      - ".github/workflows/diamond-retrieval-contract.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e . pytest

      - name: Run diamond retrieval contract tests
        run: |
          python -m unittest tests.test_diamond_retrieval -v
          python -m unittest tests.test_diamond_retrieval_retailers -v
          python -m unittest tests.test_diamond_retrieval_proportions -v
          python -m unittest tests.test_diamond_retrieval_motion -v
          python -m unittest tests.test_diamond_retrieval_media -v
          python -m unittest tests.test_reference_media_lookup -v
          python -m unittest tests.test_filesonsky_motion -v
          python -m unittest tests.test_d360_source -v

      # Non-gating: upstream media availability is external, but logs prove
      # whether the exact Loupe360-linked V360 source is presently recoverable.
      - name: Bounded LG781646632 supplier-motion smoke
        continue-on-error: true
        run: |
          python - <<'PY'
          from diamond_retrieval import (
              ROTATION, EvidenceReference, ProgressiveRotationProcessor,
              RemoteV360RotationDownloader, UrllibHttpClient,
          )

          viewer = (
              "https://v360.in/viewer4.0/vision360.html?"
              "d=VDC-32-50&surl=https://s10.v360.in/images/company/1546/"
          )
          ref = EvidenceReference(
              identifier="igi-lg781646632:loupe360:v360",
              kind=ROTATION, retrieval_key=viewer, locator=viewer,
          )
          downloader = RemoteV360RotationDownloader(UrllibHttpClient(), timeout=8)
          raw = downloader.download(ref)
          rotation = ProgressiveRotationProcessor().process(raw)[0]
          print("Live V360 original frames:", len(rotation.frames))
          print("Source:", rotation.metadata.get("source_root"))
          print("First SHA256:", rotation.frames[0].sha256)
          assert len(rotation.frames) == 256
          PY

      # R05 is an already accepted, identity-verified educational reference.
      # This read-only smoke checks the actual original bytes in memory, never
      # publishes assets or changes reports on PR code.
      - name: Bounded R05 FilesOnSky original-source smoke
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import hashlib
          from diamond_retrieval import (
              EvidenceReference, FilesOnSkyRotationDownloader,
              ProgressiveRotationProcessor, ROTATION, UrllibHttpClient,
          )
          viewer = "https://www.filesonsky.com/v360/Vision360.HTML?d=659844"
          ref = EvidenceReference(
              identifier="ps285166-r05:filesonsky-rotation",
              kind=ROTATION, retrieval_key=viewer, locator=viewer,
          )
          adapter = FilesOnSkyRotationDownloader(UrllibHttpClient(), timeout=12)
          raw = adapter.download(ref)
          rotation = ProgressiveRotationProcessor().process(raw)[0]
          assert len(rotation.frames) == 256
          assert [f.source_index for f in rotation.frames] == list(range(256))
          print("R05 original Vision360 frame count:", len(rotation.frames))
          print("R05 original first-frame SHA256:", hashlib.sha256(rotation.frames[0].payload).hexdigest())
          print("R05 original source:", rotation.metadata["supplier"])
          PY

      - name: Record full-suite status
        continue-on-error: true
        run: python -m unittest discover -s tests -v
