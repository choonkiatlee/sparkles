name: R13 R15 observed Imgur four video HEAD audit

on:
  pull_request:
    paths:
      - "tools/audit_r13_r15_four_video_heads.py"
      - "tests/test_r13_r15_four_video_heads.py"
      - ".github/workflows/r13-r15-four-head-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code, no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser helper
        run: python -m pip install selenium
      - name: Unit-test exact URL, ID, album and HEAD-only contract
        run: python -m unittest tests.test_r13_r15_four_video_heads tests.test_r13_r15_imgur -v
      - name: Browser observe two pinned album APIs, HEAD matched videos only
        timeout-minutes: 7
        run: python -m tools.audit_r13_r15_four_video_heads --out "$RUNNER_TEMP/r13-r15-exact-video-head.json"
      - name: Retain sanitized hashes and HEAD metadata, no video or still bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r13-r15-four-mp4-head-only
          path: ${{ runner.temp }}/r13-r15-exact-video-head.json
          retention-days: 30
          if-no-files-found: warn
