name: validate issue 26 activation

on:
  push:
    branches: [issue-26-activation-descriptor]
    paths:
      - ".github/workflows/issue26-validation.yml"
      - "diamond360/**"
      - "tests/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/issue26-validation.yml"
      - "diamond360/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: issue26-activation-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Recover benchmark wide windows
        run: |
          python - <<'PY'
          import base64,hashlib,json,time,urllib.request
          from pathlib import Path
          from diamond360.benchmark import cyclic_window

          repo=Path.cwd(); root=Path('/tmp/sources'); root.mkdir()
          benchmark=json.loads((repo/'docs/360/benchmark/benchmark.json').read_text())

          def fetch(url):
              last=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      return urllib.request.urlopen(req,timeout=60).read()
                  except Exception as exc:
                      last=exc; time.sleep(2*(attempt+1))
              raise last

          for stone in benchmark['stones']:
              if stone['source_status']!='complete': continue
              cert=stone['certificate']
              source_manifest_path=repo/'docs/360/benchmark/per-stone'/cert/'source-manifest.json'
              manifest=json.loads(source_manifest_path.read_text())
              assert manifest['sequence_complete'] is True and len(manifest['frames'])==256
              wanted=cyclic_window(stone['faceup_center'],benchmark['wide_window'],stone['source_frame_count'])
              batch_values={}
              for batch in manifest['batches']:
                  raw=fetch(batch['url'])
                  assert hashlib.sha256(raw).hexdigest()==batch['sha256']
                  values=json.loads(raw); assert len(values)==batch['count']
                  batch_values[batch['batch']]=values
              lookup={f['source_index']:f for f in manifest['frames']}
              dest=root/cert; frames_dir=dest/'frames'; frames_dir.mkdir(parents=True)
              selected=[]
              for index in wanted:
                  record=dict(lookup[index])
                  blob=base64.b64decode(batch_values[record['batch']][record['stored_position']],validate=True)
                  assert hashlib.sha256(blob).hexdigest()==record['sha256']
                  path=Path(record['path']).name
                  (frames_dir/path).write_bytes(blob)
                  record['path']=f'frames/{path}'
                  selected.append(record)
              subset=dict(manifest)
              subset['sequence_complete']=False
              subset['frames']=selected
              subset['recovery_note']='issue #26 wide-window subset regenerated from hash-verified #18 batch provenance'
              (dest/'source-manifest.json').write_text(json.dumps(subset,indent=2)+'\n')
              print(cert,'recovered',len(selected),'frames')
          PY
      - name: Preprocess wide windows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from diamond360.pipeline import run
          root=Path('/tmp/sources'); processed=Path('/tmp/processed'); processed.mkdir()
          for source in sorted(root.iterdir()):
              manifest=json.loads((source/'source-manifest.json').read_text())
              indices=[f['source_index'] for f in manifest['frames']]
              result=run(source,processed/source.name,order_manifest=source/'source-manifest.json',
                         gain=1.0,diagnostic_indices=indices,accept_review=True)
              print(source.name,sum('registration' in r for r in result['frames']),'/',len(indices),'registered')
          PY
      - name: Generate activation evidence
        run: |
          rm -rf /tmp/issue26-validation /tmp/steps
          python - <<'PY'
          import csv,json,shutil
          from pathlib import Path
          import numpy as np
          from diamond360.benchmark import cyclic_window
          from diamond360.asscher_steps import run as step_run
          from diamond360.activation_benchmark import measure_stone,write_stone_outputs

          repo=Path.cwd(); benchmark=json.loads((repo/'docs/360/benchmark/benchmark.json').read_text())
          out=Path('/tmp/issue26-validation'); out.mkdir(); steps=Path('/tmp/steps'); processed=Path('/tmp/processed')
          payloads={}; stones=[]; rows=[]
          pairs=[('centre','centre'),('inner','inner_step'),('middle','middle_step'),('outer','outer_step')]
          for stone in benchmark['stones']:
              if stone['source_status']!='complete': continue
              cert=stone['certificate']; payloads[cert]={}; windows={}
              for window,size in (('core',benchmark['core_window']),('wide',benchmark['wide_window'])):
                  indices=cyclic_window(stone['faceup_center'],size,stone['source_frame_count'])
                  step_dir=steps/cert/window
                  step_result=step_run(processed/cert,step_dir,indices,wrap=True)
                  result=measure_stone(processed/cert,step_dir,indices,wrap=True)
                  target=out/'per-stone'/cert/window; write_stone_outputs(result,target,processed/cert)
                  if window=='wide': shutil.rmtree(target/'evidence')
                  payloads[cert][window]=result
                  windows[window]={'template_status':step_result['template_status'],'template_reason':step_result.get('template_reason'),
                                   'upstream_validity':result['upstream_validity'],'accepted_frames':len(result['accepted_indices'])}
                  with (target/'activation.csv').open() as f:
                      rows.extend({'certificate':cert,'window':window,**r} for r in csv.DictReader(f))
              stones.append({'certificate':cert,'source_pipeline':stone['source_pipeline'],'windows':windows})

          first=next(s for s in benchmark['stones'] if s['source_status']=='complete')
          summary={'schema_version':'diamond360-activation-benchmark/1',
                   'core_indices':cyclic_window(first['faceup_center'],benchmark['core_window'],first['source_frame_count']),
                   'wide_indices':cyclic_window(first['faceup_center'],benchmark['wide_window'],first['source_frame_count']),
                   'stones':stones,'row_count':len(rows)}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,allow_nan=False)+'\n')
          with (out/'summary.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def corr(x,y):
              p=[(a,b) for a,b in zip(x,y) if a is not None and b is not None]
              if len(p)<3:return None
              x=np.asarray([a for a,b in p]); y=np.asarray([b for a,b in p])
              return None if np.std(x)==0 or np.std(y)==0 else float(np.corrcoef(x,y)[0,1])
          def nd(a,b): return None if a is None or b is None else abs(b-a)/(abs(a)+abs(b)+1e-12)
          geometry=[]; support=[]; window_rows=[]
          for cert,ws in payloads.items():
              for window,result in ws.items():
                  for cr,sr in pairs:
                      for mode in ('fixed','dynamic'):
                          for kind in ('raw','relative'):
                              c=result['representations']['coarse']['regions'][cr][mode]; s=result['representations']['semantic']['regions'].get(sr,{}).get(mode)
                              if not s: continue
                              cv=c[f'{kind}_summary']['total_excursion']; sv=s[f'{kind}_summary']['total_excursion']
                              geometry.append({'certificate':cert,'window':window,'support_mode':mode,'trace_type':kind,'coarse_region':cr,'semantic_region':sr,
                                               'coarse_total_excursion':cv,'semantic_total_excursion':sv,'normalized_difference':nd(cv,sv),
                                               'trace_correlation':corr(c[f'{kind}_values'],s[f'{kind}_values'])})
                  for rep in ('coarse','semantic'):
                      for region,modes in result['representations'][rep].get('regions',{}).items():
                          for kind in ('raw','relative'):
                              f=modes['fixed']; d=modes['dynamic']; fv=f[f'{kind}_summary']['total_excursion']; dv=d[f'{kind}_summary']['total_excursion']
                              support.append({'certificate':cert,'window':window,'representation':rep,'region':region,'trace_type':kind,
                                              'fixed_total_excursion':fv,'dynamic_total_excursion':dv,'normalized_difference':nd(fv,dv),
                                              'trace_correlation':corr(f[f'{kind}_values'],d[f'{kind}_values'])})
              core,wide=ws['core'],ws['wide']
              for rep in ('coarse','semantic'):
                  for region in sorted(set(core['representations'][rep].get('regions',{})) & set(wide['representations'][rep].get('regions',{}))):
                      for mode in ('fixed','dynamic'):
                          for kind in ('raw','relative'):
                              cv=core['representations'][rep]['regions'][region][mode][f'{kind}_summary']['total_excursion']
                              wv=wide['representations'][rep]['regions'][region][mode][f'{kind}_summary']['total_excursion']
                              window_rows.append({'certificate':cert,'representation':rep,'region':region,'support_mode':mode,'trace_type':kind,
                                                  'core_total_excursion':cv,'wide_total_excursion':wv,'normalized_difference':nd(cv,wv)})
          top=lambda xs: sorted([x for x in xs if x['normalized_difference'] is not None],key=lambda x:x['normalized_difference'],reverse=True)[:16]
          comparison={'schema_version':'diamond360-activation-comparison/1','geometry':geometry,'support':support,'window':window_rows,
                      'review_queue':{'geometry':top([x for x in geometry if x['window']=='core']),
                                      'support':top([x for x in support if x['window']=='core']),'window':top(window_rows)}}
          (out/'comparison.json').write_text(json.dumps(comparison,indent=2,allow_nan=False)+'\n')
          print('rows',len(rows),'geometry',len(geometry),'support',len(support),'window',len(window_rows))
          PY
      - name: Stage evidence and test
        run: |
          rm -rf docs/360/activation
          cp -R /tmp/issue26-validation docs/360/activation
          python -m unittest discover -s tests -v
      - name: Commit generated evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/360/activation
          git commit -m "docs: add issue 26 activation benchmark evidence"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: issue26-activation-validation
          path: /tmp/issue26-validation
          retention-days: 7
