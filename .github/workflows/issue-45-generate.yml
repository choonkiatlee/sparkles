name: Issue 45 descriptor profile generation

on:
  push:
    branches:
      - issue-45-descriptor-profile

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m diamond360.descriptor_profile --repository . --output docs/360/profile
          python -m unittest tests.test_descriptor_profile
      - name: Commit compact generated profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/360/profile/per-stone docs/360/profile/comparison.json docs/360/profile/comparison.csv
          git diff --cached --quiet && exit 0
          git commit -m "360: add retained descriptor profiles [skip ci]"
          git push origin HEAD:issue-45-descriptor-profile
