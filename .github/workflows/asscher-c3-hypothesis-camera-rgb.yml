name: asscher-c3-hypothesis-camera-rgb

concurrency:
  group: asscher-c3-hypothesis-camera-rgb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_c3_hypothesis_qc.py"
      - "tests/test_asscher_geometry_c3_hypothesis_qc.py"
      - "docs/360/asscher-geometry-validation/C3-HYPOTHESIS-GEOMETRY-QC.md"
      - ".github/workflows/asscher-c3-hypothesis-camera-rgb.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run focused hypothesis and frozen validation tests
        run: |
          python -m unittest \
            tests.test_asscher_geometry_c3_hypothesis_qc \
            tests.test_asscher_geometry_inner_evidence_diagnostic \
            tests.test_asscher_window_peak_experiment \
            tests.test_asscher_geometry_validation -v

      - name: Download frozen v3 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: asscher-window-peak-stability-v3-experiment
          run-id: 37767669755
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-v3

      - name: Download and verify four frozen camera-RGB source bundles
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          root = Path("outputs/c3-hypothesis-sources")
          root.mkdir(parents=True, exist_ok=True)
          for item in manifest["bundles"]:
              archive = root / item["filename"]
              urllib.request.urlretrieve(item["download_url"], archive)
              assert archive.stat().st_size == item["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == item["sha256"]
              dest = root / item["certificate"]
              dest.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Reconstruct competing C3 rings and source-camera RGB overlays
        run: |
          python -m diamond360.asscher_geometry_c3_hypothesis_qc \
            --source-root outputs/c3-hypothesis-sources \
            --output outputs/asscher-c3-hypothesis-geometry-qc

      - name: Validate selected frame provenance and frozen full-view C3 peak
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          report = json.loads(Path(
              "outputs/asscher-c3-hypothesis-geometry-qc/summary.json"
          ).read_text())
          assert report["stone_count"] == 4
          assert report["no_estimator_change"]
          for stone in report["stones"]:
              certificate = stone["certificate"]
              reference_path = Path(
                  "outputs/frozen-v3/per-stone"
              ) / certificate / "primary-wireframe.json"
              baseline = json.loads(reference_path.read_text())
              selected = [v["source_index"] for v in baseline["selected_frames"]]
              assert stone["selected_source_indices"] == selected, certificate
              full = next(c for c in stone["cases"] if c["case_id"] == "full")
              old = (baseline.get("boundary_evidence") or {}).get(
                  "C3_TABLE", {}
              ).get("global_u")
              if old is not None:
                  assert full["v3_selected_c3_u"] is not None
                  assert math.isclose(full["v3_selected_c3_u"], old,
                                      rel_tol=0, abs_tol=1e-9), certificate
              print(certificate, stone["status"], "selected", selected,
                    "full hypotheses", full["hypothesis_u"])
              for row in stone["cases"]:
                  print(" ", row["case_id"], row["hypothesis_u"],
                        "source image", row["camera_RGB_QC_path"])
          PY

      - name: Upload per-stone original camera RGB A/B triptychs and JSON
        uses: actions/upload-artifact@v4
        with:
          name: asscher-c3-hypothesis-camera-rgb
          path: outputs/asscher-c3-hypothesis-geometry-qc
          if-no-files-found: error
          retention-days: 90
