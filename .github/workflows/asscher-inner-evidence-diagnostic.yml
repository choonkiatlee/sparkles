name: asscher-inner-evidence-diagnostic

concurrency:
  group: asscher-inner-evidence-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_inner_evidence_diagnostic.py"
      - "tests/test_asscher_geometry_inner_evidence_diagnostic.py"
      - "docs/360/asscher-geometry-validation/INNER-EVIDENCE-DIAGNOSTIC.md"
      - ".github/workflows/asscher-inner-evidence-diagnostic.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run frozen diagnostics tests
        run: python -m unittest tests.test_asscher_geometry_inner_evidence_diagnostic -v

      - name: Fetch #115 immutable validation evidence
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-outer-stability

      - name: Download hash-pinned LG756520111 original
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          row, = [v for v in manifest["bundles"] if
                  v["certificate"] == "IGI-LG756520111"]
          root = Path("outputs/inner-evidence-sources")
          root.mkdir(parents=True, exist_ok=True)
          archive = root / row["filename"]
          urllib.request.urlretrieve(row["download_url"], archive)
          assert archive.stat().st_size == row["bytes"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == row["sha256"]
          destination = root / row["certificate"]
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zipped:
              zipped.extractall(destination)
          PY

      - name: Reproduce frozen C3 modal evidence and normalization audit
        run: |
          python -m diamond360.asscher_geometry_inner_evidence_diagnostic \
            --source-root outputs/inner-evidence-sources/IGI-LG756520111 \
            --source-manifest docs/360/benchmark/per-stone/IGI-LG756520111/source-manifest.json \
            --reference-dir outputs/frozen-outer-stability \
            --output outputs/asscher-inner-evidence-diagnostic

      - name: Print selected competing peaks and silhouette drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("outputs/asscher-inner-evidence-diagnostic/diagnostic.json").read_text()
          )
          for label in ("with_all", "without_focus_frame"):
              case = p[label]
              print(label, case["status"], case["c3_selected_global_u"])
              for v in case["c3_candidates"]:
                  print("  candidate", v["u"], "score", v["selection_score"],
                        "support", v["sector_support"], "prominence", v["prominence"])
          for f in p["frames"]:
              print("frame", f["source_index"],
                    "ray-rms", f["silhouette_ray_rms_fraction_of_median"],
                    "ray-max", f["silhouette_ray_max_abs_fraction_of_median"],
                    "rotation-deg", f["registered_orientation_deg_mod_90"],
                    "rectification", f["rectification"])
          print("frozen replay", p["frozen_115_reproduction_checked"])
          PY

      - name: Upload reproducible C3 mode and projection audit
        uses: actions/upload-artifact@v4
        with:
          name: asscher-inner-evidence-diagnostic
          path: outputs/asscher-inner-evidence-diagnostic
          retention-days: 90
          if-no-files-found: error
