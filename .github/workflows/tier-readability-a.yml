name: tier-readability-a

on:
  pull_request:
    paths:
      - "diamond360/asscher_steps.py"
      - "diamond360/regions.py"
      - "diamond360/tier_contrast.py"
      - "diamond360/tier_contrast_benchmark.py"
      - "tests/test_asscher_steps.py"
      - "tests/test_regions.py"
      - "tests/test_tier_contrast.py"
      - "tests/test_tier_contrast_benchmark.py"
      - ".github/workflows/tier-readability-a.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run issue 57 PR A tests
        run: |
          python -m unittest \
            tests.test_asscher_steps \
            tests.test_regions \
            tests.test_tier_contrast \
            tests.test_tier_contrast_benchmark \
            -v

      - name: Record full-suite status
        continue-on-error: true
        run: python -m unittest discover -s tests -v
