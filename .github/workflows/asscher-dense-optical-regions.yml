name: asscher-dense-optical-regions

concurrency:
  group: asscher-dense-optical-regions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_dense_optical_regions.py"
      - "tests/test_asscher_dense_optical_regions.py"
      - "docs/360/asscher-geometry-validation/DENSE-OPTICAL-REGIONS.md"
      - ".github/workflows/asscher-dense-optical-regions.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify dense windows, photometry and physical-provenance negative controls
        run: |
          python -m unittest \
            tests.test_asscher_dense_optical_regions \
            tests.test_asscher_optical_neighbor_motion \
            tests.test_asscher_optical_physical_provenance \
            tests.test_asscher_facet_provenance \
            tests.test_asscher_geometry_validation -v

      - name: Fetch immutable frozen outer-selection and neighbor appearance baselines
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-v2

      - uses: actions/download-artifact@v4
        with:
          name: asscher-neighbor-optical-motion
          run-id: 37854076791
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-neighbor-optical

      - name: Download SHA-256 pinned four original camera-RGB rotations
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest=json.loads(Path("docs/360/benchmark/source-bundles.json").read_text())
          root=Path("outputs/dense-optical-sources")
          root.mkdir(parents=True,exist_ok=True)
          for row in manifest["bundles"]:
              archive=root/row["filename"]
              urllib.request.urlretrieve(row["download_url"],archive)
              assert archive.stat().st_size==row["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==row["sha256"]
              dest=root/row["certificate"]
              dest.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Replay all 4 contiguous RGB appearance windows on frozen gauge
        run: |
          python -m diamond360.asscher_dense_optical_regions \
            --source-root outputs/dense-optical-sources \
            --output outputs/asscher-dense-optical-regions

      - name: Validate frozen #96 anchors and consistent overlap with #178
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          root=Path("outputs/asscher-dense-optical-regions")
          summary=json.loads((root/"summary.json").read_text())
          assert len(summary["stones"])==4
          assert summary["physical_facet_correspondence"]=="unavailable"
          assert summary["no_estimator_change"]
          assert summary["no_quality_score"]
          for stone in summary["stones"]:
              cert=stone["certificate"]
              reference=json.loads((Path("outputs/frozen-v2/per-stone")/
                                    cert/"primary-wireframe.json").read_text())
              assert stone["selected_source_indices"]==[
                  x["source_index"] for x in reference["selected_frames"]
              ]
              evidence=json.loads((root/"per-stone"/cert/
                                   "dense-optical-regions.json").read_text())
              previous=json.loads((Path("outputs/frozen-neighbor-optical/per-stone")/
                                   cert/"optical-neighbor-motion.json").read_text())
              prior={(p["positions"][0],p["positions"][1]):p
                     for p in previous["pairs"] if p["status"]=="observed"}
              overlaps=0
              positions=[]
              for row in evidence["pairs"]:
                  a,b=row["positions"]
                  assert (b-a)%256==1,(cert,a,b)
                  positions.append((a,b))
                  assert row["physical_facet_semantic_ids"] is None
                  if row["status"]=="observed":
                      assert row["physical_facet_correspondence"]=="unavailable"
                      assert len(row["bins"])==16
                      assert all(x["physical_facet_semantic_id"] is None
                                 for x in row["bins"])
                      if (a,b) in prior:
                          overlaps+=1
                          assert math.isclose(
                              row["median_gain_normalized_abs_change"],
                              prior[a,b]["median_gain_normalized_abs_change"],
                              rel_tol=0,abs_tol=1e-10), (cert,a,b)
              assert len(set(positions))==len(positions)
              assert len(positions)<=36
              assert overlaps>0,cert
              assert evidence["dense_window_policy"]["all_anchors_covered"]
              print(cert,"face",stone["face_identity"]["status"],
                    "pairs",stone["measured_pair_count"],"of",len(positions),
                    "bins",stone["total_optical_bin_count"],
                    "baseline overlap",overlaps)
          PY

      - name: Upload original RGB dense optical-change atlas and explicit missingness
        uses: actions/upload-artifact@v4
        with:
          name: asscher-dense-optical-regions
          path: outputs/asscher-dense-optical-regions
          retention-days: 90
          if-no-files-found: error
