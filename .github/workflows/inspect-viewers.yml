name: inspect diamond viewers
on:
  push:
    branches: [verify-issue-18-benchmark-v2]
    paths: [.github/workflows/inspect-viewers.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Inspect Diajewel CryptoJS logic
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://vision.diajewel360.com/js/vision360.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          js=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          print('len',len(js))
          for term in ['CryptoJS','scramble','AES','decrypt','Utf8','Pkcs7','CBC']:
              print('\nTERM',term)
              start=0; count=0
              while True:
                  i=js.find(term,start)
                  if i<0 or count>=8: break
                  print('INDEX',i,repr(js[max(0,i-1800):i+4200]))
                  start=i+len(term); count+=1
          PY
