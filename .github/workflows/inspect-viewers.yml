name: inspect diamond viewers
on:
  push:
    branches: [verify-issue-18-benchmark-v2]
    paths: [.github/workflows/inspect-viewers.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Inspect metadata and player ordering logic
        run: |
          python - <<'PY'
          import json,re,urllib.request
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=60).read()
          metas={
            'ref':'https://vision.diajewel360.com/imaged/VL-131355/0.json',
            '818':'https://vision.diajewel360.com/imaged/PD-230293/0.json',
            '836':'https://vision.diajewel360.com/imaged/PD-249203/0.json',
            '756':'https://data1.360view.link/data/1/imaged/2612250-YK-808/0.json?version=',
          }
          for k,u in metas.items():
              print('\n===== META',k,'=====')
              m=json.loads(get(u))
              for key,val in m.items():
                  if key.lower()=='image': continue
                  text=repr(val)
                  if len(text)>3000: text=text[:3000]+'...'
                  print(key,'=',text)
          scripts=[
            'https://vision.diajewel360.com/js/vision360.js',
            'https://workshop.360view.link/360viewer/js/360view.js',
          ]
          terms=re.compile(r'version|json|order|shuffle|interleave|reverse|sort|frame|imageData|totalImage|top_index|index',re.I)
          for u in scripts:
              print('\n===== SCRIPT',u,'=====')
              text=get(u).decode('utf-8','replace')
              print('bytes',len(text))
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if terms.search(line):
                      lo=max(0,i-2); hi=min(len(lines),i+3)
                      print(f'--- {lo+1}-{hi} ---')
                      print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
