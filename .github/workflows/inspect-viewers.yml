name: inspect diamond viewers
on:
  push:
    branches: [verify-issue-18-benchmark-v2]
    paths: [.github/workflows/inspect-viewers.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Inspect string table declaration
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://vision.diajewel360.com/js/vision360.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          js=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          print('len',len(js))
          for pat in ['_0x18db','0x18db','var _0x']:
              i=js.find(pat); print('PAT',pat,'INDEX',i); print(repr(js[max(0,i-1500):i+3000]))
          PY
