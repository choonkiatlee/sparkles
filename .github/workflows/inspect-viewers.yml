name: inspect diamond viewers
on:
  push:
    branches: [verify-issue-18-benchmark-v2]
    paths: [.github/workflows/inspect-viewers.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Decode Workshop ordering metadata
        run: |
          python - <<'PY'
          import ast,json,re,subprocess,urllib.request
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=60).read()
          js=get('https://vision.diajewel360.com/js/vision360.js').decode('utf-8','replace')
          m=re.search(r'var\s+_0xb946\s*=\s*(\[.*?\]);',js,re.S)
          table=ast.literal_eval(m.group(1))
          key=table[332].encode()
          meta=json.loads(get('https://data1.360view.link/data/1/imaged/2612250-YK-808/0.json?version='))
          p=subprocess.run(['openssl','enc','-d','-aes-128-cbc','-K',key.hex(),'-iv',key.hex(),'-base64','-A'],
                           input=meta['scramble'].encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          print('rc',p.returncode,'stderr',p.stderr.decode())
          print('plain',repr(p.stdout[:10000]))
          x=json.loads(p.stdout)
          print('len',len(x),'sizes',[len(v) for v in x])
          PY
