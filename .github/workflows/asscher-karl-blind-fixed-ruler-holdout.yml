name: asscher-karl-blind-fixed-ruler-holdout

on:
  pull_request:
    paths:
      - "diamond360/asscher_semantic_optical_karl_holdout.py"
      - "diamond360/asscher_semantic_optical_sensitivity.py"
      - "tests/test_asscher_semantic_optical_karl_holdout.py"
      - "docs/360/asscher-geometry-validation/KARL-PRICE-SCOPE-BLIND-HOLDOUT.md"
      - ".github/workflows/asscher-karl-blind-fixed-ruler-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-external:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test blinded source controls
        run: |
          python -m pip install -e .
          python -m unittest tests.test_asscher_semantic_optical_karl_holdout \
            tests.test_asscher_semantic_optical_sensitivity -v
      - name: Download exact PriceScope archive without extracting expert labels for model input
        run: |
          set -euo pipefail
          mkdir -p /tmp/karl-original-media
          gh release download pricescope-research-2026-10-06-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern pricescope-media-recovery-2026-10-06-v3.zip \
            --dir /tmp
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path("/tmp/pricescope-media-recovery-2026-10-06-v3.zip")
          expected="379f411098e4d96df78d7c00fea5bb9fd18d5f37d890b873928c4003ba126da5"
          assert path.stat().st_size==36567890, "archive byte count changed"
          assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, "archive SHA changed"
          print("PriceScope original archive verified",path.stat().st_size)
          PY
          unzip -q /tmp/pricescope-media-recovery-2026-10-06-v3.zip \
            -d /tmp/karl-original-media
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          base=Path("/tmp/karl-original-media")
          candidates=[base]+[p for p in base.iterdir() if p.is_dir()]
          for d in candidates:
              if (d/"media").is_dir() and (d/"d360").is_dir():
                  print("KARL_ARCHIVE_ROOT="+str(d))
                  break
          else:
              raise SystemExit("Original media/ and d360/ not found")
          PY
      - name: Run original unseen Karl_K Crispest and Glittery through frozen method once
        run: |
          python -m diamond360.asscher_semantic_optical_karl_holdout \
            --archive-root "$KARL_ARCHIVE_ROOT" \
            --catalog docs/360/external-benchmark/pricescope/benchmark-manifest.json \
            --output outputs/asscher-karl-blind-holdout
      - name: Verify blind holdout report and that no cut/performance score was inferred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/asscher-karl-blind-holdout")
          summ=json.loads((root/"summary.json").read_text())
          assert not summ["labels_accessed_during_fitting"]
          assert not summ["physical_facet_scores_available"]
          ids={"asscher-eval-crispest","asscher-eval-glittery"}
          assert set(summ["cases"])==ids
          for sid in sorted(ids):
              rec=json.loads((root/sid/"blind-92-holdout.json").read_text())
              assert rec["source_label_or_karl_rank_used"] is False
              assert rec["quality_score"] is None
              assert rec["source"]["expert_labels_read_by_pipeline"] is False
              assert rec["policy"]["frozen_geometry_method"]=="outer_octagon_v2"
              if rec["geometry_supported"]:
                  assert rec["geometry_fit_count"]==1
                  assert rec["per_frame_geometry_fit_count"]==0
                  assert rec["sampled_frame_count"]<=11
                  assert len(rec["primary_source_indices"])>=3
                  assert all(not frame["per_frame_geometry_refitted"]
                             for frame in rec["frames"])
                  assert all(row["physical_facet_correspondence"]=="not_established"
                             for f in rec["frames"] for row in f["sample"]["entities"])
              else:
                  assert rec["status"]=="unavailable"
                  assert rec["frames"]==[]
              print(sid,rec["status"],
                    "sampled",len(rec["frames"]),
                    "geometry_fits",rec.get("geometry_fit_count",0),
                    "reason",rec.get("reason"))
          PY
      - name: Upload tiny Karl holdout JSON and visualizations only
        uses: actions/upload-artifact@v4
        with:
          name: asscher-karl-crispest-glittery-fixed-ruler-holdout
          path: |
            outputs/asscher-karl-blind-holdout/summary.json
            outputs/asscher-karl-blind-holdout/asscher-eval-crispest/blind-92-holdout.json
            outputs/asscher-karl-blind-holdout/asscher-eval-crispest/blind-92-holdout.png
            outputs/asscher-karl-blind-holdout/asscher-eval-glittery/blind-92-holdout.json
            outputs/asscher-karl-blind-holdout/asscher-eval-glittery/blind-92-holdout.png
          if-no-files-found: error
