name: asscher-rgb-junction-graph-diagnostic

concurrency:
  group: asscher-rgb-junction-graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_junction_graph.py"
      - "tests/test_asscher_geometry_junction_graph.py"
      - "docs/360/asscher-geometry-validation/RGB-JUNCTION-GRAPH.md"
      - ".github/workflows/asscher-rgb-junction-graph.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Test independent RGB lines and frozen-contract isolation
        run: |
          python -m unittest \
            tests.test_asscher_geometry_junction_graph \
            tests.test_asscher_geometry_rgb_lines \
            tests.test_asscher_geometry_inner_evidence_diagnostic \
            tests.test_asscher_geometry_validation -v

      - name: Fetch immutable #96 outer-octagon baseline
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-outer-v2

      - name: Retrieve original camera-RGB source rotations with frozen SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          root = Path("outputs/native-RGB-facet-line-sources")
          root.mkdir(parents=True, exist_ok=True)
          for row in manifest["bundles"]:
              archive = root / row["filename"]
              urllib.request.urlretrieve(row["download_url"], archive)
              assert archive.stat().st_size == row["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == row["sha256"]
              dest = root / row["certificate"]
              dest.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Build observed RGB line-junction graph and uncertainty-preserving QC
        run: |
          python -m diamond360.asscher_geometry_junction_graph \
            --source-root outputs/native-RGB-facet-line-sources \
            --output outputs/asscher-rgb-junction-graph

      - name: Verify frozen source selection and preserve uncertain crown identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/asscher-rgb-junction-graph")
          report=json.loads((root/"summary.json").read_text())
          assert len(report["stones"])==4
          assert not report["estimator_modified"]
          assert not report["physical_facet_identity_verified"]
          for row in report["stones"]:
              cert=row["certificate"]
              before=json.loads((Path("outputs/frozen-outer-v2/per-stone")
                                 /cert/"primary-wireframe.json").read_text())
              expected=[s["source_index"] for s in before["selected_frames"]]
              assert row["selected_source_indices"]==expected,(cert,expected)
              assert (root/"per-stone"/cert/"junction-evidence.json").exists()
              for frame in row["frame_counts"]:
                  assert frame["connected_edges"]<=frame["junction_candidates"]*3
              print(cert,"face:",row["face_identity"]["status"],
                    "source indices",expected,
                    "corner/connection counts",row["frame_counts"],
                    "QC",row["RGB_contact_sheet"])
          PY

      - name: Upload native RGB junction candidates and explicit missingness
        uses: actions/upload-artifact@v4
        with:
          name: asscher-rgb-junction-graph-diagnostic
          path: outputs/asscher-rgb-junction-graph
          retention-days: 90
          if-no-files-found: error
