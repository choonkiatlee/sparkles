name: asscher-topology-contract

on:
  pull_request:
    paths:
      - "diamond360/asscher_topology.py"
      - "tests/test_asscher_topology.py"
      - "docs/360/asscher-topology/**"
      - ".github/workflows/asscher-topology-contract.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run Asscher topology contract tests
        run: python -m unittest tests.test_asscher_topology -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v
