name: Issue 28 temporary validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate four-stone switching benchmark
        shell: python
        run: |
          import base64
          import csv
          import hashlib
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          from diamond360.pipeline import run as preprocess
          from diamond360.asscher_steps import run as step_bands
          from diamond360.switching_benchmark import measure_stone, write_stone_outputs

          ROOT = Path(".work-issue28")
          SOURCE_ROOT = ROOT / "sources"
          WORK_ROOT = ROOT / "runs"
          OUT_ROOT = ROOT / "switching"
          for path in (SOURCE_ROOT, WORK_ROOT, OUT_ROOT):
              path.mkdir(parents=True, exist_ok=True)

          CORE = list(range(248, 256)) + list(range(0, 9))
          WIDE = list(range(240, 256)) + list(range(0, 17))
          CERTS = [
              "IGI-LG756580087",
              "IGI-LG756520111",
              "IGI-LG818659722",
              "IGI-LG836619414",
          ]

          def request_bytes(url, referer):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                          "(KHTML, like Gecko) Chrome/140.0 Safari/537.36"
                      ),
                      "Accept": "application/json,text/plain,*/*",
                      "Referer": referer,
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          def regenerate_source(certificate):
              manifest_path = Path(
                  f"docs/360/benchmark/per-stone/{certificate}/source-manifest.json"
              )
              manifest = json.loads(manifest_path.read_text())
              source = SOURCE_ROOT / certificate
              frames = source / "frames"
              frames.mkdir(parents=True, exist_ok=True)

              batches = {}
              for spec in manifest["batches"]:
                  raw = request_bytes(spec["url"], manifest["viewer"])
                  actual = hashlib.sha256(raw).hexdigest()
                  if actual != spec["sha256"]:
                      raise RuntimeError(
                          f"{certificate}: batch {spec['batch']} sha mismatch "
                          f"{actual} != {spec['sha256']}"
                      )
                  payload = json.loads(raw)
                  if len(payload) != spec["count"]:
                      raise RuntimeError(
                          f"{certificate}: batch {spec['batch']} count "
                          f"{len(payload)} != {spec['count']}"
                      )
                  batches[spec["batch"]] = payload

              for frame in manifest["frames"]:
                  payload = batches[frame["batch"]][frame["stored_position"]]
                  data = base64.b64decode(payload)
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != frame["sha256"] or len(data) != frame["bytes"]:
                      raise RuntimeError(
                          f"{certificate}: source frame {frame['source_index']} "
                          "failed retained hash/size contract"
                      )
                  target = source / frame["path"]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              print(certificate, "regenerated", len(manifest["frames"]), "verified frames")
              return source, manifest_path

          summary_rows = []
          for certificate in CERTS:
              source, manifest_path = regenerate_source(certificate)
              stone_work = WORK_ROOT / certificate
              processed = stone_work / "processed"
              preprocess(
                  source,
                  processed,
                  order_manifest=manifest_path,
                  gain=1.0,
                  diagnostic_indices=WIDE,
                  accept_review=True,
              )
              for window, indices in (("core", CORE), ("wide", WIDE)):
                  steps = stone_work / f"steps-{window}"
                  step_bands(processed, steps, indices, wrap=True)
                  result = measure_stone(processed, steps, indices, wrap=True)
                  target = OUT_ROOT / "per-stone" / certificate / window
                  write_stone_outputs(result, target, processed, steps)

                  for representation, rep in result["representations"].items():
                      for region, modes in rep.get("regions", {}).items():
                          for support_mode, wrapper in modes.items():
                              for threshold, cell in wrapper["thresholds"].items():
                                  pixel = cell["per_pixel_rate"]
                                  summary_rows.append({
                                      "certificate": certificate,
                                      "window": window,
                                      "representation": representation,
                                      "region": region,
                                      "support_mode": support_mode,
                                      "threshold": float(threshold),
                                      "status": cell["validity"]["status"],
                                      "reasons": ";".join(cell["validity"]["reasons"]),
                                      "regional_switch_rate": cell["regional_switch_rate"],
                                      "pixel_rate_q50": pixel["q50"],
                                      "pixel_rate_q90": pixel["q90"],
                                      "pixel_fraction_nonzero": pixel["fraction_nonzero"],
                                      "observed_adjacent_pairs": cell["observed_adjacent_pairs"],
                                      "eligible_pixel_pairs": cell["eligible_pixel_pairs"],
                                      "persistent_support_fraction": cell["persistent_support_fraction"],
                                  })
              print(certificate, "measured")

          summary = {
              "schema_version": "sparkles-bright-dark-switching-benchmark/1",
              "issue": 28,
              "core_indices": CORE,
              "wide_indices": WIDE,
              "stones": CERTS,
              "thresholds": [0.60, 0.65, 0.70],
              "baseline_threshold": 0.65,
              "rows": summary_rows,
          }
          (OUT_ROOT / "summary.json").write_text(
              json.dumps(summary, indent=2, allow_nan=False) + "\n"
          )
          fields = list(summary_rows[0])
          with (OUT_ROOT / "summary.csv").open("w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(summary_rows)

          compact = ROOT / "compact"
          compact.mkdir()
          shutil.copy2(OUT_ROOT / "summary.json", compact / "summary.json")
          shutil.copy2(OUT_ROOT / "summary.csv", compact / "summary.csv")
          for certificate in CERTS:
              for window in ("core", "wide"):
                  src = OUT_ROOT / "per-stone" / certificate / window / "switching.json"
                  dst = compact / "per-stone" / certificate / window / "switching.json"
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          shutil.make_archive("issue28-switching-benchmark", "zip", compact)
          print("benchmark rows", len(summary_rows))
      - uses: actions/upload-artifact@v4
        with:
          name: issue28-switching-benchmark
          path: issue28-switching-benchmark.zip
          retention-days: 3
