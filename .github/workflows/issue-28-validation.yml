name: Issue 28 temporary validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-28-bright-dark-switching
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Run four-stone benchmark from release assets
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          from diamond360.pipeline import run as preprocess
          from diamond360.asscher_steps import run as step_bands
          from diamond360.switching_benchmark import measure_stone, write_stone_outputs

          ROOT = Path(".work-issue28")
          SOURCE_ROOT = ROOT / "sources"
          WORK_ROOT = ROOT / "runs"
          OUT_ROOT = ROOT / "switching"
          for path in (SOURCE_ROOT, WORK_ROOT, OUT_ROOT):
              path.mkdir(parents=True, exist_ok=True)

          CORE = list(range(248, 256)) + list(range(0, 9))
          WIDE = list(range(240, 256)) + list(range(0, 17))
          bundle_index = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          if bundle_index.get("release_tag") != "benchmark-sources-v1":
              raise RuntimeError("unexpected benchmark source release")
          bundles = bundle_index["bundles"]

          prior_summary_path = Path("docs/360/switching/summary.json")
          prior_summary = (
              json.loads(prior_summary_path.read_text())
              if prior_summary_path.exists()
              else None
          )

          def download_bundle(bundle):
              certificate = bundle["certificate"]
              archive = SOURCE_ROOT / bundle["filename"]
              request = urllib.request.Request(
                  bundle["download_url"],
                  headers={
                      "User-Agent": "sparkles-issue-28-benchmark/1",
                      "Accept": "application/octet-stream",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  archive.write_bytes(response.read())

              data = archive.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != bundle["sha256"]:
                  raise RuntimeError(
                      f"{certificate}: release ZIP sha mismatch "
                      f"{actual} != {bundle['sha256']}"
                  )
              if len(data) != bundle["bytes"]:
                  raise RuntimeError(
                      f"{certificate}: release ZIP size mismatch "
                      f"{len(data)} != {bundle['bytes']}"
                  )

              extracted = SOURCE_ROOT / certificate
              extracted.mkdir()
              with zipfile.ZipFile(archive) as handle:
                  handle.extractall(extracted)
              manifests = list(extracted.rglob("source-manifest.json"))
              if len(manifests) != 1:
                  raise RuntimeError(
                      f"{certificate}: expected one source-manifest.json, "
                      f"found {len(manifests)}"
                  )
              manifest_path = manifests[0]
              release_manifest = json.loads(manifest_path.read_text())
              committed_manifest = json.loads(
                  Path(bundle["source_manifest"]).read_text()
              )
              for key in ("schema_version", "source_frame_count", "sequence_complete"):
                  if release_manifest.get(key) != committed_manifest.get(key):
                      raise RuntimeError(
                          f"{certificate}: release manifest disagrees on {key}"
                      )
              release_frames = [
                  (item["source_index"], item["path"], item["sha256"])
                  for item in release_manifest["frames"]
              ]
              committed_frames = [
                  (item["source_index"], item["path"], item["sha256"])
                  for item in committed_manifest["frames"]
              ]
              if release_frames != committed_frames:
                  raise RuntimeError(
                      f"{certificate}: release manifest frame contract changed"
                  )
              if len(release_frames) != bundle["frame_count"]:
                  raise RuntimeError(
                      f"{certificate}: release frame count mismatch"
                  )
              print(
                  certificate,
                  "release ZIP verified",
                  bundle["sha256"],
                  f"({len(release_frames)} frames)",
              )
              return manifest_path.parent, manifest_path

          summary_rows = []
          for bundle in bundles:
              certificate = bundle["certificate"]
              source, manifest_path = download_bundle(bundle)
              stone_work = WORK_ROOT / certificate
              processed = stone_work / "processed"
              preprocess(
                  source,
                  processed,
                  order_manifest=manifest_path,
                  gain=1.0,
                  diagnostic_indices=WIDE,
                  accept_review=True,
              )
              for window, indices in (("core", CORE), ("wide", WIDE)):
                  steps = stone_work / f"steps-{window}"
                  step_bands(processed, steps, indices, wrap=True)
                  result = measure_stone(processed, steps, indices, wrap=True)
                  target = OUT_ROOT / "per-stone" / certificate / window
                  write_stone_outputs(result, target, processed, steps)

                  for representation, rep in result["representations"].items():
                      for region, modes in rep.get("regions", {}).items():
                          for support_mode, wrapper in modes.items():
                              for threshold, cell in wrapper["thresholds"].items():
                                  pixel = cell["per_pixel_rate"]
                                  summary_rows.append({
                                      "certificate": certificate,
                                      "window": window,
                                      "representation": representation,
                                      "region": region,
                                      "support_mode": support_mode,
                                      "threshold": float(threshold),
                                      "status": cell["validity"]["status"],
                                      "reasons": ";".join(cell["validity"]["reasons"]),
                                      "regional_switch_rate": cell["regional_switch_rate"],
                                      "pixel_rate_q50": pixel["q50"],
                                      "pixel_rate_q90": pixel["q90"],
                                      "pixel_fraction_nonzero": pixel["fraction_nonzero"],
                                      "observed_adjacent_pairs": cell["observed_adjacent_pairs"],
                                      "eligible_pixel_pairs": cell["eligible_pixel_pairs"],
                                      "persistent_support_fraction": cell["persistent_support_fraction"],
                                  })
              print(certificate, "measured from release source")

          if prior_summary is not None and prior_summary.get("rows") != summary_rows:
              raise RuntimeError(
                  "release-based benchmark does not reproduce the prior "
                  "hash-verified live-vendor regeneration"
              )
          print("release results exactly reproduce prior live-vendor summary rows")

          summary = {
              "schema_version": "sparkles-bright-dark-switching-benchmark/1",
              "issue": 28,
              "core_indices": CORE,
              "wide_indices": WIDE,
              "stones": [bundle["certificate"] for bundle in bundles],
              "thresholds": [0.60, 0.65, 0.70],
              "baseline_threshold": 0.65,
              "source_release_tag": bundle_index["release_tag"],
              "source_bundles": [
                  {
                      "certificate": bundle["certificate"],
                      "filename": bundle["filename"],
                      "sha256": bundle["sha256"],
                      "bytes": bundle["bytes"],
                  }
                  for bundle in bundles
              ],
              "rows": summary_rows,
          }
          (OUT_ROOT / "summary.json").write_text(
              json.dumps(summary, indent=2, allow_nan=False) + "\n"
          )
          fields = list(summary_rows[0])
          with (OUT_ROOT / "summary.csv").open("w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(summary_rows)

          # Full pair traces remain a CI artifact; Git keeps only compact audit evidence.
          artifact = ROOT / "artifact"
          artifact.mkdir()
          shutil.copy2(OUT_ROOT / "summary.json", artifact / "summary.json")
          shutil.copy2(OUT_ROOT / "summary.csv", artifact / "summary.csv")
          for bundle in bundles:
              certificate = bundle["certificate"]
              for window in ("core", "wide"):
                  src = OUT_ROOT / "per-stone" / certificate / window / "switching.json"
                  dst = artifact / "per-stone" / certificate / window / "switching.json"
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          shutil.make_archive("issue28-switching-benchmark", "zip", artifact)

          compact = ROOT / "compact"
          compact.mkdir()
          shutil.copy2(OUT_ROOT / "summary.json", compact / "summary.json")
          shutil.copy2(OUT_ROOT / "summary.csv", compact / "summary.csv")
          selected_evidence = [
              "per-stone/IGI-LG836619414/core/evidence/coarse-middle-fixed.png",
              "per-stone/IGI-LG836619414/wide/evidence/coarse-outer-fixed.png",
              "per-stone/IGI-LG836619414/wide/evidence/coarse-outer-pair_local.png",
              "per-stone/IGI-LG818659722/core/evidence/coarse-inner-fixed.png",
              "per-stone/IGI-LG818659722/core/evidence/semantic-inner_step-fixed.png",
          ]
          for relative in selected_evidence:
              src = OUT_ROOT / relative
              dst = compact / relative
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          publish = Path("docs/360/switching")
          if publish.exists():
              shutil.rmtree(publish)
          shutil.copytree(compact, publish)
          print("benchmark rows", len(summary_rows))
      - name: Commit compact release-based benchmark evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/360/switching
          git diff --cached --quiet || git commit -m "docs: use release sources for switching benchmark [skip ci]"
          git push origin HEAD:issue-28-bright-dark-switching
      - uses: actions/upload-artifact@v4
        with:
          name: issue28-switching-benchmark
          path: issue28-switching-benchmark.zip
          retention-days: 3
