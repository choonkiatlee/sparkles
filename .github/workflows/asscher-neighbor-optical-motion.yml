name: asscher-neighbor-optical-motion

concurrency:
  group: asscher-neighbor-optical-motion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_optical_neighbor_motion.py"
      - "tests/test_asscher_optical_neighbor_motion.py"
      - "docs/360/asscher-geometry-validation/NEIGHBOR-OPTICAL-MOTION.md"
      - ".github/workflows/asscher-neighbor-optical-motion.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify gain, motion, missingness and physical identity negative tests
        run: |
          python -m unittest \
            tests.test_asscher_optical_neighbor_motion \
            tests.test_asscher_facet_provenance \
            tests.test_asscher_optical_physical_provenance \
            tests.test_asscher_geometry_validation -v

      - name: Get immutable #96 four-stone selected-view reference
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-v2

      - name: Download SHA-256-pinned four-stone original RGB rotations
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest=json.loads(Path("docs/360/benchmark/source-bundles.json").read_text())
          root=Path("outputs/neighbor-optical-sources")
          root.mkdir(parents=True,exist_ok=True)
          for row in manifest["bundles"]:
              archive=root/row["filename"]
              urllib.request.urlretrieve(row["download_url"],archive)
              assert archive.stat().st_size==row["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==row["sha256"]
              dest=root/row["certificate"]
              dest.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Compare adjacent original-camera RGB appearance in frozen #80 gauge
        run: |
          python -m diamond360.asscher_optical_neighbor_motion \
            --source-root outputs/neighbor-optical-sources \
            --output outputs/asscher-neighbor-optical-motion

      - name: Verify frozen anchors, adjacent ordinal provenance, and no facet labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path("outputs/asscher-neighbor-optical-motion")
          summary=json.loads((output/"summary.json").read_text())
          assert len(summary["stones"])==4
          assert summary["no_physical_facet_ids"] and summary["no_estimator_change"]
          for item in summary["stones"]:
              cert=item["certificate"]
              reference=json.loads((Path("outputs/frozen-v2/per-stone")/
                                    cert/"primary-wireframe.json").read_text())
              expected=[row["source_index"] for row in reference["selected_frames"]]
              assert item["frozen_anchor_source_indices"]==expected,(cert,expected)
              evidence=json.loads((output/"per-stone"/cert/
                                   "optical-neighbor-motion.json").read_text())
              assert evidence["production_estimator_changed"] is False
              assert evidence["physical_facet_identity"]=="not_established"
              assert len(evidence["pairs"])<=12
              positions=[]
              for pair in evidence["pairs"]:
                  a,b=pair["positions"]
                  assert (b-a)%256==1,(cert,a,b)
                  positions.append((a,b))
                  assert pair["physical_facet_semantic_ids"] is None
                  if pair["status"]=="observed":
                      assert pair["physical_facet_correspondence"]=="unavailable"
                      assert pair["median_gain_normalized_abs_change"]>=0
                      for patch in pair["patches"]:
                          assert patch.get("physical_facet_semantic_id") is None
              assert len(set(positions))==len(positions)
              print(cert,"face",item["face_identity"]["status"],
                    "adjacent",item["measured_pair_count"],"of",
                    item["candidate_pair_count"],
                    "appearance",item["median_gain_normalized_abs_change"],
                    "skips",item["skipped_pair_reasons"])
          PY

      - name: Upload original RGB neighbor comparisons and optical-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: asscher-neighbor-optical-motion
          path: outputs/asscher-neighbor-optical-motion
          retention-days: 90
          if-no-files-found: error
