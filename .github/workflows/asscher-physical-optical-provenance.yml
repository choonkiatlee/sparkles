name: asscher-physical-optical-provenance

concurrency:
  group: asscher-physical-optical-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_facet_provenance.py"
      - "tests/test_asscher_facet_provenance.py"
      - "docs/360/asscher-geometry-validation/PHYSICAL-OPTICAL-PROVENANCE.md"
      - ".github/workflows/asscher-physical-optical-provenance.yml"
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Test provenance boundary and frozen geometry contract
        run: |
          python -m unittest \
            tests.test_asscher_facet_provenance \
            tests.test_asscher_semantic_optical_handoff \
            tests.test_asscher_geometry_validation -v

      - name: Retrieve immutable source-camera RGB observed lines from #146
        uses: actions/download-artifact@v4
        with:
          name: asscher-native-RGB-facet-line-diagnostic
          run-id: 37813575116
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/archived-native-rgb-lines

      - name: Retrieve immutable observed RGB junctions from #162
        uses: actions/download-artifact@v4
        with:
          name: asscher-rgb-junction-graph-diagnostic
          run-id: 37815198934
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/archived-rgb-junctions

      - name: Build separate physical and optical provenance without changing geometry
        run: |
          python -m diamond360.asscher_facet_provenance \
            --line-root outputs/archived-native-rgb-lines \
            --junction-root outputs/archived-rgb-junctions \
            --output outputs/asscher-facet-provenance

      - name: Verify four-stone invariants and no facet promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/asscher-facet-provenance")
          report=json.loads((root/"summary.json").read_text())
          assert report["all_interior_physical_boundaries_unavailable"]
          assert report["no_estimator_change"]
          assert len(report["stones"]) == 4
          for row in report["stones"]:
              item=json.loads((root/row["provenance_path"]).read_text())
              physical=item["physical_geometry"]
              assert physical["silhouette"]["semantic_id"]=="GIRDLE_OUTLINE"
              assert not physical["physical_correspondence_verified"]
              assert all(x["status"]=="unavailable" and x["vertices"] is None
                         for x in physical["interior_facet_boundaries"])
              assert len(physical["interior_facet_boundaries"])==3
              assert item["counts"]["physical_interior_boundaries_validated"]==0
              optical=item["optical_appearance"]
              assert not optical["any_physical_facet_labels"]
              assert all(x["physical_facet_correspondence"]=="not_established"
                         and x["physical_facet_semantic_id"] is None
                         for x in optical["segments"]+optical["junction_candidates"])
              assert len(item["selected_source_indices"])==5
              print(row["certificate"],row["crown_face_identity"],
                    "RGB line observations",item["counts"]["optical_segment_observations"],
                    "RGB junction observations",item["counts"]["optical_junction_observations"],
                    "validated inner boundaries",0)
          PY

      - name: Upload provenance-only evidence and negative-control outputs
        uses: actions/upload-artifact@v4
        with:
          name: asscher-physical-optical-provenance
          path: outputs/asscher-facet-provenance
          if-no-files-found: error
          retention-days: 90
