name: asscher-semantic-optical-handoff-smoke

on:
  pull_request:
    paths:
      - "diamond360/asscher_semantic_optical_handoff.py"
      - "tests/test_asscher_semantic_optical_handoff.py"
      - "docs/360/asscher-geometry-validation/SEMANTIC-OPTICAL-HANDOFF.md"
      - ".github/workflows/asscher-semantic-optical-handoff-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Test fixed semantic ruler without moving geometry
        run: python -m unittest tests.test_asscher_semantic_optical_handoff -v
      - name: Document scope
        run: |
          echo "Synthetic fixed-ruler handoff tested only."
          echo "No four-stone reprocessing, expert-angle claims, or quality scoring."
