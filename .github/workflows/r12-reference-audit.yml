name: R12 reference source audit

on:
  pull_request:
    paths:
      - "tools/audit_r12_reference.py"
      - "tests/test_r12_reference_audit.py"
      - ".github/workflows/r12-reference-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-r12:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local Sparkles package
        run: python -m pip install -e .
      - name: Test R12 exact-source and identity guards
        run: python -m unittest tests.test_r12_reference_audit -v
      - name: Probe exact candidate report forms (read only)
        run: python -m tools.audit_r12_reference
      - name: Validate any identity-matched motion in memory, never publish
        timeout-minutes: 17
        continue-on-error: true
        run: python -m tools.audit_r12_reference --media
