name: catalogue-thumbnail-auto

# Backfill current saved stones immediately after this code merges, and allow
# a rerun if a transient external storage read initially fails.
on:
  push:
    branches: [master]
    paths:
      - "diamond_catalogue/faceup_thumbnail.py"
      - "diamond_catalogue/faceup_publish.py"
      - "diamond_catalogue/auto_thumbnail_batch.py"
      - ".github/workflows/catalogue-thumbnail-auto.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sparkles-diamond-catalogue-master-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Automatically generate missing overview thumbnails
        env:
          GITHUB_REF: refs/heads/master
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m diamond_catalogue.auto_thumbnail_batch --limit 100

  deploy-pages:
    needs: generate
    uses: ./.github/workflows/catalogue-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
