name: asscher-projected-pavilion-synthetic

on:
  pull_request:
    paths:
      - "diamond360/asscher_profile_projected_fit.py"
      - "diamond360/asscher_profile_synthetic.py"
      - "diamond360/asscher_profile_synthetic_benchmark.py"
      - "tests/test_asscher_projected_pavilion_synthetic.py"
      - ".github/workflows/asscher-projected-pavilion-synthetic.yml"
  workflow_dispatch:

jobs:
  synthetic-generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Check syntax and target-blind synthetic regressions
        run: |
          python -m compileall -q \
            diamond360/asscher_profile_projected_fit.py \
            diamond360/asscher_profile_synthetic.py \
            diamond360/asscher_profile_synthetic_benchmark.py
          python -m unittest tests.test_asscher_projected_pavilion_synthetic -v
      - name: Evaluate the separate fixed synthetic holdout matrix
        run: |
          python -m diamond360.asscher_profile_synthetic_benchmark \
            --output outputs/asscher-projected-pavilion-synthetic
      - name: Verify real diamonds and physical facet angles are excluded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/asscher-projected-pavilion-synthetic")
          r=json.loads((p/"synthetic-holdout-report.json").read_text())
          assert r["summary"]["cases"] == 12
          assert r["summary"]["left_right_side_evaluations"] == 24
          assert r["source_kind"] == "no_real_diamond_data_ever_loaded"
          assert r["physical_pavilion_angles_claimed"] is False
          assert r["external_DiaGem_and_Sergey_used_for_tuning"] is False
          assert (p/"synthetic-pavilion-montage.png").is_file()
          assert all(
              "missed_true_breaks" in side and "false_positive_breaks" in side
              for case in r["cases"] for side in case["sides"].values()
          )
          print("Synthetic holdout:",r["summary"])
          PY
      - name: Upload full synthetic benchmark (including failures)
        uses: actions/upload-artifact@v4
        with:
          name: asscher-projected-pavilion-synthetic
          path: outputs/asscher-projected-pavilion-synthetic/
          if-no-files-found: error
