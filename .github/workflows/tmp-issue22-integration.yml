name: Temporary #22 integration validation
on:
  push:
    branches:
      - issue-22-empirical-calibration
permissions:
  contents: write
jobs:
  calibrate:
    if: ${{ !contains(github.event.head_commit.message, '[calibration-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-empirical-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install Pillow
      - name: Regenerate calibration
        run: python -m diamond360.calibration --repository . --output docs/360/calibration
      - name: Test calibration and upstream contracts
        run: python -m unittest tests.test_calibration tests.test_descriptor_profile tests.test_evidence_packet
      - name: Commit generated benchmark
        run: |
          if ! git diff --quiet -- docs/360/calibration/benchmark.json docs/360/calibration/benchmark.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/360/calibration/benchmark.json docs/360/calibration/benchmark.csv
            git commit -m "360: regenerate integrated calibration [calibration-generated]"
            git push origin HEAD:issue-22-empirical-calibration
          fi
