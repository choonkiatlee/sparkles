name: diamond-catalogue-contract

on:
  pull_request:
    paths:
      - "diamond_catalogue/**"
      - ".github/workflows/diamond-catalogue-ingest.yml"
      - "tests/test_diamond_catalogue*.py"
      - "docs/diamond-catalogue.md"
      - "pyproject.toml"
      - ".github/workflows/diamond-catalogue-contract.yml"
  workflow_dispatch:

jobs:
  catalogue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify catalogue contract and existing retrieval tests
        run: |
          python -m unittest tests.test_diamond_catalogue -v
          python -m unittest tests.test_diamond_catalogue_integration -v
          python -m unittest tests.test_diamond_catalogue_publisher -v
          python -m unittest tests.test_diamond_catalogue_diagnostics -v
          python -m unittest tests.test_diyona_report_hint -v
          python -m unittest tests.test_diyona_public_api -v
          python -m unittest tests.test_diamond_retrieval -v
          python -m unittest tests.test_diamond_retrieval_retailers -v
          python -m unittest tests.test_diamond_retrieval_motion -v
          python -m unittest tests.test_diamond_retrieval_media -v

      - name: Diagnose exact Diyona identity disagreement (read-only probe)
        continue-on-error: true
        run: |
          python - <<'PY'
          from diamond_retrieval import retrieve_diamond
          from diamond_retrieval.errors import IdentityConflictError
          url = "https://diyona.com/pages/diamond-detail?sku=A69835AA4"
          try:
              result = retrieve_diamond(url)
          except IdentityConflictError as exc:
              print("IDENTITY CONFLICTS:")
              for comparison in exc.comparisons:
                  if comparison.field in {"report_number", "lab", "origin", "shape",
                                          "carat", "colour", "clarity", "dimensions"}:
                      print("field", comparison.field, "values", repr(comparison.values),
                            "sources", sorted(set(p.source for p in comparison.provenance)))
          else:
              print("NO IDENTITY CONFLICT", result.metadata.report_number, result.status.value)
          PY
