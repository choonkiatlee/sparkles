name: Issue 33 flash morphology benchmark

on:
  push:
    branches:
      - issue-33-flash-morphology

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and run focused tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest tests.test_morphology tests.test_morphology_benchmark

      - name: Run canonical four-stone benchmark
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          import numpy as np
          from scipy.stats import spearmanr

          from diamond360.pipeline import run as preprocess
          from diamond360.morphology_benchmark import measure_stone, write_stone_outputs

          ROOT = Path.cwd()
          CORE = [248,249,250,251,252,253,254,255,0,1,2,3,4,5,6,7,8]
          WIDE = list(range(240,256)) + list(range(0,17))
          WINDOWS = {"core": CORE, "wide": WIDE}
          bundles = json.loads((ROOT / "docs/360/benchmark/source-bundles.json").read_text())["bundles"]

          work = Path("/tmp/issue33")
          downloads = work / "downloads"
          full_root = work / "full"
          subset_root = work / "subset"
          processed_root = work / "processed"
          result_root = work / "results"
          for path in (downloads, full_root, subset_root, processed_root, result_root):
              path.mkdir(parents=True, exist_ok=True)

          docs = ROOT / "docs/360/morphology"
          if docs.exists():
              shutil.rmtree(docs)
          (docs / "evidence").mkdir(parents=True)

          compact_stones = []
          csv_rows = []
          frame_rows = []

          def finite_spearman(left, right):
              pairs = [
                  (float(a), float(b))
                  for a, b in zip(left, right)
                  if a is not None and b is not None
                  and np.isfinite(float(a)) and np.isfinite(float(b))
              ]
              if len(pairs) < 3:
                  return None
              a = [p[0] for p in pairs]
              b = [p[1] for p in pairs]
              if len(set(a)) < 2 or len(set(b)) < 2:
                  return None
              return float(spearmanr(a, b).statistic)

          for bundle in bundles:
              cert = bundle["certificate"]
              archive = downloads / bundle["filename"]
              urllib.request.urlretrieve(bundle["download_url"], archive)
              assert archive.stat().st_size == bundle["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == bundle["sha256"]

              full = full_root / cert
              full.mkdir()
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(full)
              manifests = list(full.rglob("source-manifest.json"))
              assert len(manifests) == 1, (cert, manifests)
              source_manifest = manifests[0]
              source_dir = source_manifest.parent
              manifest = json.loads(source_manifest.read_text())

              selected = set(WIDE)
              subset = subset_root / cert
              subset.mkdir()
              frames = []
              for frame in manifest["frames"]:
                  if frame["source_index"] not in selected:
                      continue
                  src = source_dir / frame["path"]
                  dst = subset / frame["path"]
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  frames.append(frame)
              assert {frame["source_index"] for frame in frames} == selected
              subset_manifest = dict(manifest)
              subset_manifest["frames"] = frames
              subset_manifest["sequence_complete"] = False
              subset_manifest["subset_reason"] = "issue #33 exact 33-frame sensitivity interval"
              (subset / "source-manifest.json").write_text(
                  json.dumps(subset_manifest, indent=2) + "\n"
              )

              processed = processed_root / cert
              preprocess(
                  subset,
                  processed,
                  subset / "source-manifest.json",
                  gain=1.0,
                  diagnostic_indices=WIDE,
                  accept_review=True,
              )

              stone = {"certificate": cert, "windows": {}}
              for window, indices in WINDOWS.items():
                  result = measure_stone(processed, indices, wrap=True)
                  out = result_root / cert / window
                  write_stone_outputs(result, out, processed)
                  fixed_baseline = result["supports"]["fixed"]["thresholds"]["1.00"]
                  for frame in fixed_baseline["frames"]:
                      if frame["status"] == "ok":
                          frame_rows.append({
                              "certificate": cert,
                              "window": window,
                              "active_fraction": frame["active_fraction"],
                              "largest_component_fraction": frame["largest_component_fraction"],
                              "effective_component_count": frame["effective_component_count"],
                          })

                  compact_window = {
                      "support_disagreement": result["support_disagreement"],
                      "fixed_evidence": result["supports"]["fixed"]["baseline_evidence"],
                      "fixed_threshold_sensitivity": result["supports"]["fixed"]["threshold_sensitivity"],
                      "dynamic_threshold_sensitivity": result["supports"]["dynamic"]["threshold_sensitivity"],
                      "supports": {},
                  }
                  for mode, wrapper in result["supports"].items():
                      compact_window["supports"][mode] = {}
                      for threshold, cell in wrapper["thresholds"].items():
                          summary = cell["summary"]
                          compact_window["supports"][mode][threshold] = {
                              "validity": cell["validity"],
                              "persistent_support_fraction": cell["persistent_support_fraction"],
                              "summary": summary,
                          }
                          csv_rows.append({
                              "certificate": cert,
                              "window": window,
                              "support_mode": mode,
                              "threshold": threshold,
                              "status": cell["validity"]["status"],
                              "active_frame_fraction": summary["active_frame_fraction"],
                              "median_active_fraction": summary["median_active_fraction"],
                              "median_largest_component_fraction": summary["median_largest_component_fraction"],
                              "q10_largest_component_fraction": summary["q10_largest_component_fraction"],
                              "q90_largest_component_fraction": summary["q90_largest_component_fraction"],
                              "median_effective_component_count": summary["median_effective_component_count"],
                              "q90_effective_component_count": summary["q90_effective_component_count"],
                              "median_boundary_active_fraction": summary["median_boundary_active_fraction"],
                              "persistent_support_fraction": cell["persistent_support_fraction"],
                          })
                  stone["windows"][window] = compact_window

                  if window == "core":
                      shutil.copy2(
                          out / "evidence" / "diagnostic.png",
                          docs / "evidence" / f"{cert}-core.png",
                      )
              compact_stones.append(stone)

          def metric(stone, window, mode, threshold, key):
              return stone["windows"][window]["supports"][mode][threshold]["summary"][key]

          certs = [stone["certificate"] for stone in compact_stones]
          analyses = {}
          for key in ("median_largest_component_fraction", "median_effective_component_count"):
              core = [metric(s, "core", "fixed", "1.00", key) for s in compact_stones]
              wide = [metric(s, "wide", "fixed", "1.00", key) for s in compact_stones]
              low = [metric(s, "core", "fixed", "0.75", key) for s in compact_stones]
              high = [metric(s, "core", "fixed", "1.25", key) for s in compact_stones]
              dynamic = [metric(s, "core", "dynamic", "1.00", key) for s in compact_stones]
              analyses[key] = {
                  "core_values": dict(zip(certs, core)),
                  "wide_values": dict(zip(certs, wide)),
                  "core_to_wide_spearman": finite_spearman(core, wide),
                  "threshold_rank_spearman_0.75_vs_1.00": finite_spearman(low, core),
                  "threshold_rank_spearman_1.25_vs_1.00": finite_spearman(high, core),
                  "fixed_vs_dynamic_core_spearman": finite_spearman(core, dynamic),
              }

          core_frames = [row for row in frame_rows if row["window"] == "core"]
          analyses["pooled_core_frames"] = {
              "n": len(core_frames),
              "active_area_vs_largest_component_fraction_spearman": finite_spearman(
                  [row["active_fraction"] for row in core_frames],
                  [row["largest_component_fraction"] for row in core_frames],
              ),
              "active_area_vs_effective_component_count_spearman": finite_spearman(
                  [row["active_fraction"] for row in core_frames],
                  [row["effective_component_count"] for row in core_frames],
              ),
              "largest_component_fraction_vs_effective_component_count_spearman": finite_spearman(
                  [row["largest_component_fraction"] for row in core_frames],
                  [row["effective_component_count"] for row in core_frames],
              ),
          }

          def csv_dicts(path):
              with path.open(newline="") as handle:
                  return list(csv.DictReader(handle))

          activation = csv_dicts(ROOT / "docs/360/activation/summary.csv")
          switching = csv_dicts(ROOT / "docs/360/switching/summary.csv")
          activation_values = {}
          switching_values = {}
          for cert in certs:
              act = [
                  row for row in activation
                  if row["certificate"] == cert and row["window"] == "core"
                  and row["representation"] == "whole_stone"
                  and row["trace_type"] == "raw"
              ]
              activation_values[cert] = float(act[0]["total_excursion"]) if act else None

              sw = [
                  float(row["regional_switch_rate"])
                  for row in switching
                  if row["certificate"] == cert and row["window"] == "core"
                  and row["representation"] == "coarse"
                  and row["region"] in {"inner", "middle"}
                  and row["support_mode"] == "fixed"
                  and row["threshold"] in {"0.65", "0.6500000000000000"}
              ]
              switching_values[cert] = float(np.mean(sw)) if sw else None

          for key in ("median_largest_component_fraction", "median_effective_component_count"):
              morphology_values = [
                  analyses[key]["core_values"][cert] for cert in certs
              ]
              analyses[key]["redundancy"] = {
                  "whole_stone_activation_total_excursion_spearman": finite_spearman(
                      morphology_values, [activation_values[cert] for cert in certs]
                  ),
                  "inner_middle_switch_rate_spearman": finite_spearman(
                      morphology_values, [switching_values[cert] for cert in certs]
                  ),
              }

          summary = {
              "schema_version": "diamond360-flash-morphology-benchmark/1",
              "core_indices": CORE,
              "wide_indices": WIDE,
              "thresholds": [0.75, 1.00, 1.25],
              "baseline_threshold": 1.00,
              "connectivity": 8,
              "stones": compact_stones,
              "analysis": analyses,
              "redundancy_inputs": {
                  "whole_stone_activation_total_excursion": activation_values,
                  "mean_coarse_fixed_inner_middle_switch_rate_0.65": switching_values,
              },
          }
          (docs / "summary.json").write_text(
              json.dumps(summary, indent=2, allow_nan=False) + "\n"
          )

          fields = [
              "certificate","window","support_mode","threshold","status",
              "active_frame_fraction","median_active_fraction",
              "median_largest_component_fraction","q10_largest_component_fraction",
              "q90_largest_component_fraction","median_effective_component_count",
              "q90_effective_component_count","median_boundary_active_fraction",
              "persistent_support_fraction",
          ]
          with (docs / "summary.csv").open("w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(csv_rows)

          print(json.dumps({
              "analysis": analyses,
              "baseline_rows": [
                  row for row in csv_rows
                  if row["window"] == "core"
                  and row["support_mode"] == "fixed"
                  and row["threshold"] == "1.00"
              ],
          }, indent=2))
          PY

      - name: Commit compact benchmark evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/360/morphology
          git commit -m "360: add issue 33 benchmark results [skip ci]"
          git push origin HEAD:issue-33-flash-morphology
