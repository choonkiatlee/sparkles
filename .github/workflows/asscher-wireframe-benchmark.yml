name: asscher-wireframe-benchmark

concurrency:
  group: asscher-wireframe-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "diamond360/asscher_steps.py"
      - "diamond360/asscher_topology.py"
      - "diamond360/asscher_sequence_gauge.py"
      - "diamond360/asscher_pose_sequence.py"
      - "diamond360/asscher_wireframe.py"
      - "diamond360/asscher_wireframe_benchmark.py"
      - "tests/test_asscher_steps.py"
      - "tests/test_asscher_topology.py"
      - "tests/test_asscher_sequence_gauge.py"
      - "tests/test_asscher_wireframe.py"
      - "docs/360/asscher-wireframe/README.md"
      - ".github/workflows/asscher-wireframe-benchmark.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run focused geometry tests
        run: |
          python -m unittest             tests.test_asscher_steps             tests.test_asscher_topology             tests.test_asscher_sequence_gauge             tests.test_asscher_wireframe -v

      - name: Record full-suite status
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Download benchmark source bundles
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          root = Path("outputs/asscher-wireframe-sources")
          root.mkdir(parents=True, exist_ok=True)

          for item in manifest["bundles"]:
              archive = root / item["filename"]
              urllib.request.urlretrieve(item["download_url"], archive)
              assert archive.stat().st_size == item["bytes"]
              assert (
                  hashlib.sha256(archive.read_bytes()).hexdigest()
                  == item["sha256"]
              )
              destination = root / item["certificate"]
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(destination)
          PY

      - name: Run frozen four-stone wireframe benchmark
        run: |
          python -m diamond360.asscher_wireframe_benchmark             --source-root outputs/asscher-wireframe-sources             --output outputs/asscher-wireframe-benchmark

      - name: Print benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("outputs/asscher-wireframe-benchmark/summary.json").read_text()
          )
          print("parameter policy:", data["parameter_policy"])
          for stone in data["stones"]:
              print(stone["certificate"])
              print("  status:", stone["status"])
              print("  selected:", stone["selected_source_indices"])
              print("  review:", stone["review_reasons"])
              print(
                  "  crown:",
                  {
                      key: round(value["confidence"], 3)
                      for key, value in stone["boundary_evidence"].items()
                  },
              )
              print(
                  "  pavilion:",
                  {
                      key: (
                          round(value["confidence"], 3),
                          value["provenance"],
                      )
                      for key, value in stone["pavilion_evidence"].items()
                  },
              )
          PY

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: asscher-wireframe-benchmark
          path: outputs/asscher-wireframe-benchmark
          if-no-files-found: error
          retention-days: 90
