name: asscher-karl-d360-external-holdout

on:
  pull_request:
    paths:
      - "diamond360/asscher_semantic_optical_external_d360.py"
      - "tests/test_asscher_semantic_optical_external_d360.py"
      - "docs/360/asscher-geometry-validation/KARL-D360-EXTERNAL-HOLDOUT.md"
      - ".github/workflows/asscher-karl-d360-external-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project dependencies
        run: python -m pip install -e .
      - name: Verify frozen-method external source gates without media
        run: python -m unittest tests.test_asscher_semantic_optical_external_d360 -v
      - name: Download complete archived original PriceScope D360 source
        run: |
          mkdir -p /tmp/pricescope-holdout
          curl -L --fail --retry 3 \
            'https://github.com/choonkiatlee/sparkles/releases/download/pricescope-research-2026-10-06-v1/pricescope-media-recovery-2026-10-06-v3.zip' \
            -o /tmp/pricescope-holdout/source-v3.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          b=Path('/tmp/pricescope-holdout/source-v3.zip')
          m=json.loads(Path('docs/360/external-benchmark/pricescope/benchmark-manifest.json').read_text())
          expected=m['storage_bundle']
          assert b.stat().st_size==expected['bytes']
          assert hashlib.sha256(b.read_bytes()).hexdigest()==expected['sha256']
          dest=Path('/tmp/pricescope-holdout/unpacked')
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(b) as z:
              z.extractall(dest)
          paths=[dest]+[p for p in dest.iterdir() if p.is_dir()]
          found=next((p for p in paths if (p/'d360').is_dir() and (p/'media').is_dir()),None)
          assert found is not None
          Path('/tmp/pricescope-holdout/root.txt').write_text(str(found))
          print("Archived v3 original source: size/hash pass, complete 256+256 frame manifests available")
          PY
      - name: Run unchanged frozen #96 geometry policy followed by fixed #92 brightness replay
        run: |
          python -m diamond360.asscher_semantic_optical_external_d360 \
            --archive-root "$(cat /tmp/pricescope-holdout/root.txt)" \
            --manifest docs/360/external-benchmark/pricescope/benchmark-manifest.json \
            --out outputs/karl-d360-holdout
      - name: Validate both predeclared external cases and source-proof abstentions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/karl-d360-holdout")
          for sid in ("asscher-eval-crispest","asscher-eval-glittery"):
              f=root/sid/"external-result.json"
              assert f.exists(),f
              r=json.loads(f.read_text())
              assert r["sample_id"]==sid
              assert r["policy"]["source_expert_labels"]=="never_loaded_or_used_in_generator"
              assert r["policy"]["geometry_method"]=="outer_octagon_v2"
              assert r["physical_angle_comparison"] is None
              assert r["quality_score"] is None
              if r["status"]=="unavailable":
                  print(sid,"ABSTAIN:",r["reason"])
                  assert r["successful_image_support_rows"]==0
              else:
                  assert r["one_stone_level_fit_only"] is True
                  assert r["refit_per_frame"] is False
                  assert r["semantic_id_count"]==55
                  assert r["face_status"] in ("unresolved_not_verified_crown",
                                             "likely_crown_from_73_not_physical_facet_proof")
                  assert all(not x["refit_performed"] and x["scaffold_unchanged"]
                             for x in r["traces"])
                  assert (root/sid/"external-image-plane-traces.png").exists()
                  assert (root/sid/"exposure-support-sensitivity.json").exists()
                  print(sid,"MEASURED:",r["successful_image_support_rows"],
                        "non-null image-plane supports /",len(r["traces"]),"frames")
          PY
      - name: Upload external falsification evidence (no source media)
        uses: actions/upload-artifact@v4
        with:
          name: karl-d360-external-holdout-replay
          path: |
            outputs/karl-d360-holdout/asscher-eval-crispest/external-result.json
            outputs/karl-d360-holdout/asscher-eval-crispest/external-image-plane-traces.png
            outputs/karl-d360-holdout/asscher-eval-crispest/exposure-support-sensitivity.json
            outputs/karl-d360-holdout/asscher-eval-crispest/exposure-support-sensitivity.png
            outputs/karl-d360-holdout/asscher-eval-glittery/external-result.json
            outputs/karl-d360-holdout/asscher-eval-glittery/external-image-plane-traces.png
            outputs/karl-d360-holdout/asscher-eval-glittery/exposure-support-sensitivity.json
            outputs/karl-d360-holdout/asscher-eval-glittery/exposure-support-sensitivity.png
          if-no-files-found: error
