name: PriceScope external benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/pricescope-external-benchmark.yml"
      - "diamond360/external_benchmark.py"
      - "diamond360/video_source.py"
      - "tests/test_external_benchmark.py"
      - "docs/360/external-benchmark/pricescope/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install project
        run: python -m pip install -e . pytest

      - name: Install motion decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Unit tests
        run: python -m pytest -q tests/test_external_benchmark.py

      - name: Fetch pinned external archive
        run: |
          curl -fL --retry 3 \
            -o /tmp/pricescope-media.zip \
            'https://github.com/choonkiatlee/sparkles/releases/download/pricescope-research-2026-10-06-v1/pricescope-media-recovery-2026-10-06-v3.zip'
          echo '379f411098e4d96df78d7c00fea5bb9fd18d5f37d890b873928c4003ba126da5  /tmp/pricescope-media.zip' | sha256sum -c -
          mkdir -p /tmp/pricescope-archive
          unzip -q /tmp/pricescope-media.zip -d /tmp/pricescope-archive

      - name: Run blind external benchmark
        run: |
          python -m diamond360.external_benchmark \
            --manifest docs/360/external-benchmark/pricescope/benchmark-manifest.json \
            --archive-root /tmp/pricescope-archive \
            --source-root /tmp/pricescope-sources \
            --output /tmp/pricescope-results \
            --prepare-sources

      - name: Validate benchmark envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/pricescope-results/summary.json")
          payload = json.loads(path.read_text())
          assert payload["schema_version"] == "sparkles-external-benchmark-results/1"
          assert payload["coverage"]["catalogued_samples"] == 32
          assert payload["labels_used_for_measurement"] is False
          assert payload["quality_thresholds_fitted"] is False
          assert payload["profile_field_count"] == 21
          print(json.dumps(payload["coverage"], indent=2, sort_keys=True))
          failed = {
              key: value
              for key, value in payload["preparation"].items()
              if value["status"] == "failed"
          }
          print("source preparation failures:", json.dumps(failed, indent=2, sort_keys=True))
          PY

      - name: Upload compact benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricescope-external-benchmark
          path: /tmp/pricescope-results
          if-no-files-found: error
          retention-days: 7
