name: issue21 validation

on:
  push:
    branches:
      - issue-21-evidence-normalization-v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_evidence_packet tests.test_descriptor_profile
