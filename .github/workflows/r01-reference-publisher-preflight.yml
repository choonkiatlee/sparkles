name: R01 reference retrieval/publisher preflight

on:
  pull_request:
    paths:
      - ".github/workflows/r01-reference-publisher-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current reviewed retrieval code
        run: python -m pip install -e .
      - name: Read-only exact R01 retrieval and publication-plan validation
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import json
          from diamond_retrieval import retrieve_reference_media
          from diamond_catalogue.reference_publish import plan_reference_media

          print("R01 preflight: exact reported IGI LG566392177; no media publication")
          try:
              result = retrieve_reference_media(
                  "ps285166-r01", lab="IGI", report_number="LG566392177",
                  media_sources=[], include_igi_pdf=False,
              )
              attempts = [
                  {"ref_kind": str(x.kind), "status": x.status.value,
                   "source_type": (x.reference_identifier or "").rsplit(":", 1)[-1]}
                  for x in result.attempts
              ]
              print("attempts:", json.dumps(attempts, sort_keys=True))
              print("identity_comparisons:",
                    [(c.outcome.value, c.reason if hasattr(c, "reason") else None)
                     for c in result.identity_comparisons])
              print("rotations:", [
                  {"frame_count": len(x.frames),
                   "supplier": x.metadata.get("supplier"),
                   "unique_sha256": len({f.sha256 for f in x.frames}),
                   "bytes": sum(len(f.payload) for f in x.frames)}
                  for x in result.rotations
              ])
              print("stills:", len(result.stills) if hasattr(result, "stills") else "n/a")
              plan = plan_reference_media(result, "ps285166-r01")
              print("publication_plan_assets:", len(plan.assets))
              print("publication_plan_bytes:", sum(x.byte_count for x in plan.assets))
              print("publication_plan_media_types:", sorted({x.media_type for x in plan.assets}))
          except Exception as exc:
              print("preflight_error_type:", type(exc).__name__)
              raise
          PY
