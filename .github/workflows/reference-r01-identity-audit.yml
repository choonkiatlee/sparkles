name: R01 read-only supplier identity candidate audit

on:
  pull_request:
    paths:
      - "tools/audit_reference_r01_source.py"
      - "tests/test_reference_r01_source_audit.py"
      - "tools/audit_reference_r01_igi_pdf.py"
      - "tests/test_reference_r01_igi_pdf.py"
      - ".github/workflows/reference-r01-identity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout reviewed source (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -e .
      - name: Check read-only audit invariants without network
        run: python -m unittest tests.test_reference_r01_source_audit tests.test_reference_r01_igi_pdf -v
      - name: Query only R01's two fixed SKU-derived report hypotheses
        timeout-minutes: 3
        run: |
          python -m tools.audit_reference_r01_source \
            --out "$RUNNER_TEMP/r01-source-audit.json"
      - name: Check fixed IGI public PDF for matching report and 4Cs (no stored PDF)
        timeout-minutes: 2
        run: |
          python -m tools.audit_reference_r01_igi_pdf \
            --out "$RUNNER_TEMP/r01-igi-audit.json"
      - name: Validate 256 exact-report proxy source frames in-memory (no publishing)
        timeout-minutes: 8
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from audit_loupe360_frame_cache import audit
          result = audit("LG566392177")
          report = {
              "reference_id": "ps285166-r01",
              "report_candidate": "LG566392177",
              "source_identity_confirmed_for_r01": False,
              "proxy_source_bytes_only": True,
              "media_published": False,
              **result,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "r01-frame-audit.json"
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          # Log concise evidence, not hundreds of individual original image hashes.
          print(json.dumps({k: v for k, v in report.items() if k not in {"format_samples"}},
                           indent=2, sort_keys=True))
          PY
      - name: Keep sanitized bounded findings (no source media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-read-only-source-audit
          path: |
            ${{ runner.temp }}/r01-source-audit.json
            ${{ runner.temp }}/r01-igi-audit.json
            ${{ runner.temp }}/r01-frame-audit.json
          if-no-files-found: warn
          retention-days: 30
