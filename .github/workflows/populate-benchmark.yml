name: populate issue 18 benchmark
on:
  push:
    branches: [verify-issue-18-benchmark-v2]
    paths: [.github/workflows/populate-benchmark.yml]
permissions:
  contents: write
jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out PR branch
        run: |
          git fetch origin issue-18-multi-stone-benchmark
          git checkout -B issue-18-multi-stone-benchmark origin/issue-18-multi-stone-benchmark
      - name: Install
        run: python -m pip install -e .
      - name: Recover and validate original sequences
        run: |
          python - <<'PY'
          import ast,base64,hashlib,io,json,re,subprocess,time,urllib.request,zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          repo=Path.cwd()
          root=Path('/tmp/sources'); root.mkdir()
          reference=json.loads((repo/'docs/360/full-sequence/IGI-LG756580087/source-manifest.json').read_text())

          def fetch(url):
              last=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      return urllib.request.urlopen(req,timeout=60).read()
                  except Exception as e:
                      last=e; time.sleep(2*(attempt+1))
              raise last

          # Derive the public viewer's AES display key from its own current JavaScript.
          js=fetch('https://vision.diajewel360.com/js/vision360.js').decode('utf-8','replace')
          table_match=re.search(r'var\s+_0xb946\s*=\s*(\[.*?\]);',js,re.S)
          assert table_match, 'Diajewel string table not found'
          table=ast.literal_eval(table_match.group(1))
          key=table[332].encode()
          assert len(key)==16

          def permutations(meta):
              p=subprocess.run(
                  ['openssl','enc','-d','-aes-128-cbc','-K',key.hex(),'-iv',key.hex(),'-base64','-A'],
                  input=meta['scramble'].encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode:
                  raise RuntimeError(p.stderr.decode())
              value=json.loads(p.stdout)
              expected=[4,4,8,16,32,64,128]
              assert [len(x) for x in value]==expected
              for n,perm in zip(expected,value):
                  assert sorted(perm)==list(range(n))
              return value

          def ordered_slots(perms):
              current=[]
              for batch,perm in enumerate(perms,1):
                  inverse=[perm.index(i) for i in range(len(perm))]
                  items=[(batch,stored) for stored in inverse]
                  if batch==1:
                      current=items
                  else:
                      for i,item in enumerate(items):
                          current.insert(((i+1)*2)-1,item)
              assert len(current)==256 and len(set(current))==256
              return current

          # Guard the reconstructed player algorithm against the audited issue-15 manifest.
          ref_meta=json.loads(fetch('https://vision.diajewel360.com/imaged/VL-131355/0.json'))
          ref_slots=ordered_slots(permutations(ref_meta))
          audited=[(f['batch'],f['stored_position']) for f in sorted(reference['frames'],key=lambda x:x['source_index'])]
          assert ref_slots==audited, 'player reconstruction does not reproduce issue-15 ordering'
          print('Reference ordering exactly reproduces audited issue-15 manifest')

          configs={
            'IGI-LG756580087': dict(
              pipeline='diajewel', viewer='https://vision.diajewel360.com/Vision360.html?d=VL-131355',
              base='https://vision.diajewel360.com/imaged/VL-131355/', version='1', archive=None),
            'IGI-LG818659722': dict(
              pipeline='diajewel', viewer='https://vision.diajewel360.com/Vision360.html?d=PD-230293',
              base='https://vision.diajewel360.com/imaged/PD-230293/', version='1',
              archive='resources/IGI-LG818659722/artifacts/IGI-LG818659722-compact-evaluation-evidence.zip'),
            'IGI-LG836619414': dict(
              pipeline='diajewel', viewer='https://vision.diajewel360.com/Vision360.html?d=PD-249203',
              base='https://vision.diajewel360.com/imaged/PD-249203/', version='1',
              archive='resources/IGI-LG836619414/artifacts/IGI-LG836619414-compact-evaluation-evidence.zip'),
            'IGI-LG756520111': dict(
              pipeline='workshop', viewer='https://workshop.360view.link/view/2612250-YK-808',
              base='https://data1.360view.link/data/1/imaged/2612250-YK-808/', version='2',
              archive='resources/IGI-LG756520111/artifacts/IGI-LG756520111-pass2-motion-diagrams.zip'),
          }

          def archived_hashes(path):
              found={}
              if not path: return found
              with zipfile.ZipFile(repo/path) as z:
                  for name in z.namelist():
                      if name.lower().endswith('.json'):
                          try: obj=json.loads(z.read(name))
                          except Exception: continue
                          stack=[obj]
                          while stack:
                              x=stack.pop()
                              if isinstance(x,dict):
                                  idx=x.get('source_index',x.get('frame_index_zero_based',x.get('index')))
                                  sha=x.get('sha256')
                                  if type(idx) is int and isinstance(sha,str) and re.fullmatch(r'[0-9a-f]{64}',sha):
                                      found[idx]=sha
                                  stack.extend(x.values())
                              elif isinstance(x,list):
                                  stack.extend(x)
                  for name in z.namelist():
                      if not re.search(r'\.(jpe?g|png)$',name,re.I): continue
                      m=re.search(r'(?:frame[-_ ]?|[/_-])(\d{3})(?=\D|$)',name,re.I)
                      if m:
                          found.setdefault(int(m.group(1)),hashlib.sha256(z.read(name)).hexdigest())
              return found

          for cert,cfg in configs.items():
              dest=root/cert; frames_dir=dest/'frames'; frames_dir.mkdir(parents=True)
              meta_url=cfg['base']+'0.json'+(('?version=') if cfg['pipeline']=='workshop' else '')
              meta_raw=fetch(meta_url); meta=json.loads(meta_raw)
              slots=ordered_slots(permutations(meta))
              batches={}; batch_records=[]
              for b in range(1,8):
                  url=cfg['base']+f'{b}.json?version={cfg["version"]}'
                  raw=fetch(url); values=json.loads(raw)
                  assert isinstance(values,list) and len(values) in (4,8,16,32,64,128)
                  batches[b]=values
                  batch_records.append(dict(batch=b,url=url,sha256=hashlib.sha256(raw).hexdigest(),count=len(values)))
              records=[]; all_hashes=set(); dimensions=set()
              for idx,(batch,stored) in enumerate(slots):
                  value=batches[batch][stored]
                  blob=base64.b64decode(value,validate=True)
                  assert blob[:2]==b'\xff\xd8' and blob[-2:]==b'\xff\xd9', (cert,batch,stored)
                  sha=hashlib.sha256(blob).hexdigest()
                  assert sha not in all_hashes, (cert,'duplicate',idx)
                  all_hashes.add(sha)
                  name=f'{cert}-frame-{idx:03d}.jpg'; rel=f'frames/{name}'
                  (frames_dir/name).write_bytes(blob)
                  with Image.open(io.BytesIO(blob)) as im:
                      im.verify()
                  with Image.open(io.BytesIO(blob)) as im:
                      dimensions.add(im.size)
                  records.append(dict(source_index=idx,path=rel,sha256=sha,bytes=len(blob),
                                      batch=batch,stored_position=stored,
                                      source_url=cfg['base']+f'{batch}.json?version={cfg["version"]}'))
              assert len(records)==256 and len(dimensions)==1
              archived=archived_hashes(cfg['archive'])
              verified=[i for i,sha in archived.items() if i<256 and records[i]['sha256']==sha]
              mismatched=[i for i,sha in archived.items() if i<256 and records[i]['sha256']!=sha]
              if cfg['archive']:
                  print(cert,'archive hash entries',len(archived),'verified',len(verified),'mismatched',mismatched)
                  assert not mismatched, (cert,'archived selected-frame mismatch',mismatched)
                  assert verified, (cert,'no archived selected frame could be verified')
              manifest=dict(
                schema_version='diamond360-source/1',
                certificate=cert,
                source_pipeline=cfg['pipeline'],
                viewer=cfg['viewer'],
                retrieved_at=datetime.now(timezone.utc).isoformat(),
                metadata_url=meta_url,
                metadata_sha256=hashlib.sha256(meta_raw).hexdigest(),
                source_frame_count=256,
                sequence_complete=True,
                dimensions=list(next(iter(dimensions))),
                ordering='viewer scramble inverse permutation, progressive odd-position interleave',
                ordering_validation='algorithm exactly reproduces audited issue-15 reference mapping; selected archived originals hash-checked where available',
                batches=batch_records,
                frames=records,
              )
              (dest/'source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
              print(cert,'recovered',len(records),'unique JPEGs',next(iter(dimensions)),
                    'version',meta.get('version'),'createdDate',meta.get('createdDate'))
          PY
      - name: Run full benchmark
        run: |
          rm -rf /tmp/benchmark-run
          python -m diamond360.benchmark docs/360/benchmark/benchmark.json \
            --source-root /tmp/sources --output /tmp/benchmark-run
      - name: Publish compact derived evidence
        run: |
          python - <<'PY'
          import hashlib,json,shutil,subprocess
          from pathlib import Path
          repo=Path.cwd(); source=Path('/tmp/sources'); run=Path('/tmp/benchmark-run')
          bench=repo/'docs/360/benchmark'
          manifest=json.loads((bench/'benchmark.json').read_text())
          result=json.loads((run/'summary.json').read_text())
          measured={s['certificate'] for s in result['stones'] if s['status']=='measured'}
          expected={'IGI-LG756580087','IGI-LG756520111','IGI-LG818659722','IGI-LG836619414'}
          assert measured==expected, (measured,expected)
          for stone in manifest['stones']:
              cert=stone['certificate']
              if cert not in measured: continue
              dest=bench/'per-stone'/cert
              if dest.exists(): shutil.rmtree(dest)
              dest.mkdir(parents=True)
              shutil.copy2(source/cert/'source-manifest.json',dest/'source-manifest.json')
              for window in ('core','wide'):
                  shutil.copytree(run/'per-stone'/cert/window,dest/window)
              seq=json.loads((run/'per-stone'/cert/'processed'/'sequence.json').read_text())
              compact=dict(
                code_baseline=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                valid_images=seq['valid_count'],
                accepted_outlines=sum('registration' in r for r in seq['frames']),
                frame_count=seq['frame_count'],
                segmentation_statuses={k:sum(r.get('segmentation',{}).get('status')==k for r in seq['frames']) for k in ('ok','review','failed')},
                byte_duplicates=[r['source_index'] for r in seq['frames'] if 'duplicate_of' in r],
                pixel_duplicates=[r['source_index'] for r in seq['frames'] if 'pixel_duplicate_of' in r],
                source_manifest_sha256=hashlib.sha256((source/cert/'source-manifest.json').read_bytes()).hexdigest(),
                core_indices=json.loads((dest/'core'/'traces.json').read_text())['requested_indices'],
                wide_indices=json.loads((dest/'wide'/'traces.json').read_text())['requested_indices'],
              )
              (dest/'run.json').write_text(json.dumps(compact,indent=2)+'\n')
              stone['source_provenance']=f'per-stone/{cert}/source-manifest.json'
              stone['trace_files']={'core':f'per-stone/{cert}/core/traces.json','wide':f'per-stone/{cert}/wide/traces.json'}
              stone['note']='complete sequence regenerated from public viewer batches and measured by the fixed benchmark protocol'
          (bench/'benchmark.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          rm -rf /tmp/benchmark-aggregate
          python -m diamond360.benchmark docs/360/benchmark/benchmark.json --output /tmp/benchmark-aggregate
          cp /tmp/benchmark-aggregate/summary.json docs/360/benchmark/summary.json
          cp /tmp/benchmark-aggregate/summary.csv docs/360/benchmark/summary.csv
          cp /tmp/benchmark-aggregate/metrics.png docs/360/benchmark/metrics.png
          cp /tmp/benchmark-aggregate/sensitivity.png docs/360/benchmark/sensitivity.png
          cp /tmp/benchmark-aggregate/redundancy.png docs/360/benchmark/redundancy.png
      - name: Verify
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/360/benchmark/summary.json').read_text())
          assert len(s['rows'])==32, len(s['rows'])
          status={x['certificate']:x['status'] for x in s['stones']}
          assert list(status.values()).count('measured')==4, status
          assert status['IGI-LG811638512']=='partial_source'
          for cert in ('IGI-LG756580087','IGI-LG756520111','IGI-LG818659722','IGI-LG836619414'):
              r=json.loads(Path(f'docs/360/benchmark/per-stone/{cert}/run.json').read_text())
              assert r['valid_images']==256 and r['accepted_outlines']>0
          print(json.dumps(s,indent=2))
          PY
      - name: Commit derived benchmark outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/360/benchmark
          git commit -m "Populate multi-stone 360 benchmark"
          git push origin HEAD:issue-18-multi-stone-benchmark
