name: Issue 33 final tests
on:
  push:
    branches:
      - issue-33-flash-morphology
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m unittest tests.test_morphology tests.test_morphology_benchmark
