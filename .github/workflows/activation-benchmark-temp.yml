name: activation benchmark temp

on:
  push:
    branches: [issue-26-activation-descriptor]
    paths:
      - .github/workflows/activation-benchmark-temp.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-26-activation-descriptor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run four-stone activation benchmark
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          import numpy as np

          from diamond360.pipeline import run as preprocess
          from diamond360.asscher_steps import run as run_steps
          from diamond360.activation_benchmark import measure_stone, write_stone_outputs

          root = Path.cwd()
          manifest = json.loads((root / "docs/360/benchmark/source-bundles.json").read_text())
          core = list(manifest["core_indices"])
          wide = list(range(240, 256)) + list(range(0, 17))
          work = Path("/tmp/sparkles-activation-benchmark")
          if work.exists():
              shutil.rmtree(work)
          downloads = work / "downloads"
          sources = work / "sources"
          processed_root = work / "processed"
          steps_root = work / "steps"
          for p in (downloads, sources, processed_root, steps_root):
              p.mkdir(parents=True, exist_ok=True)

          out_root = root / "docs/360/activation"
          if out_root.exists():
              shutil.rmtree(out_root)
          out_root.mkdir(parents=True)

          rows = []
          for item in manifest["bundles"]:
              cert = item["certificate"]
              archive = downloads / item["filename"]
              print(f"downloading {cert}")
              urllib.request.urlretrieve(item["download_url"], archive)
              assert archive.stat().st_size == item["bytes"]
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert digest == item["sha256"], (cert, digest, item["sha256"])

              source = sources / cert
              source.mkdir(parents=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(source)
              source_manifest = json.loads((source / "source-manifest.json").read_text())
              assert source_manifest["schema_version"] == "diamond360-source/1"
              assert source_manifest["source_frame_count"] == 256
              assert source_manifest["sequence_complete"] is True
              assert len(source_manifest["frames"]) == 256
              for frame in source_manifest["frames"]:
                  path = source / frame["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == frame["sha256"]

              processed = processed_root / cert
              print(f"preprocess {cert}")
              preprocess(
                  source,
                  processed,
                  order_manifest=source / "source-manifest.json",
                  gain=1.0,
                  diagnostic_indices=core,
                  accept_review=True,
              )

              for window_name, indices in (("core", core), ("wide", wide)):
                  step_out = steps_root / cert / window_name
                  print(f"steps {cert} {window_name}")
                  run_steps(processed, step_out, indices, wrap=True)
                  print(f"activation {cert} {window_name}")
                  result = measure_stone(processed, step_out, indices, wrap=True)
                  destination = out_root / "per-stone" / cert / window_name
                  write_stone_outputs(result, destination, processed)

                  whole = result["whole_stone"]
                  rows.append({
                      "certificate": cert,
                      "window": window_name,
                      "representation": "whole_stone",
                      "region": "whole_stone",
                      "support_mode": "fixed",
                      "trace_type": "raw",
                      "status": whole["validity"]["status"],
                      "reasons": ";".join(whole["validity"]["reasons"]),
                      "total_excursion": whole["summary"]["total_excursion"],
                      "mad_scale": whole["summary"]["mad_scale"],
                      "persistent_support_fraction": None,
                  })
                  for rep_name, rep in result["representations"].items():
                      for region, modes in rep.get("regions", {}).items():
                          for mode, cell in modes.items():
                              for trace_type, summary, validity in (
                                  ("raw", cell["raw_summary"], cell["raw_validity"]),
                                  ("relative", cell["relative_summary"], cell["relative_validity"]),
                              ):
                                  rows.append({
                                      "certificate": cert,
                                      "window": window_name,
                                      "representation": rep_name,
                                      "region": region,
                                      "support_mode": mode,
                                      "trace_type": trace_type,
                                      "status": validity["status"],
                                      "reasons": ";".join(validity["reasons"]),
                                      "total_excursion": summary["total_excursion"],
                                      "mad_scale": summary["mad_scale"],
                                      "persistent_support_fraction": cell["persistent_support_fraction"],
                                  })

          fields = ["certificate","window","representation","region","support_mode","trace_type",
                    "status","reasons","total_excursion","mad_scale","persistent_support_fraction"]
          with (out_root / "summary.csv").open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)

          # Compact machine-readable benchmark facts for review/disposition work.
          alias = {"centre":"centre","inner":"inner","middle":"middle","outer":"outer",
                   "inner_step":"inner","middle_step":"middle","outer_step":"outer"}
          facts = {
              "schema_version": "diamond360-activation-benchmark/1",
              "core_indices": core,
              "wide_indices": wide,
              "stones": [x["certificate"] for x in manifest["bundles"]],
              "rows": rows,
              "comparisons": [],
          }
          by = {}
          for row in rows:
              if row["representation"] == "whole_stone":
                  continue
              key = (row["certificate"], row["window"], row["representation"], alias[row["region"]],
                     row["support_mode"], row["trace_type"])
              by[key] = row
          for cert in facts["stones"]:
              for window in ("core","wide"):
                  for region in ("centre","inner","middle","outer"):
                      for trace_type in ("raw","relative"):
                          for mode in ("fixed","dynamic"):
                              c = by.get((cert,window,"coarse",region,mode,trace_type))
                              s = by.get((cert,window,"semantic",region,mode,trace_type))
                              if c and s and c["total_excursion"] is not None and s["total_excursion"] is not None:
                                  denom = max(abs(c["total_excursion"]), abs(s["total_excursion"]), 1e-12)
                                  facts["comparisons"].append({
                                      "kind":"geometry", "certificate":cert, "window":window,
                                      "region":region, "trace_type":trace_type, "support_mode":mode,
                                      "a":"coarse","b":"semantic",
                                      "a_total":c["total_excursion"],"b_total":s["total_excursion"],
                                      "relative_disagreement":abs(c["total_excursion"]-s["total_excursion"])/denom,
                                  })
                          for rep in ("coarse","semantic"):
                              f = by.get((cert,window,rep,region,"fixed",trace_type))
                              d = by.get((cert,window,rep,region,"dynamic",trace_type))
                              if f and d and f["total_excursion"] is not None and d["total_excursion"] is not None:
                                  denom = max(abs(f["total_excursion"]), abs(d["total_excursion"]), 1e-12)
                                  facts["comparisons"].append({
                                      "kind":"support", "certificate":cert, "window":window,
                                      "region":region, "trace_type":trace_type, "representation":rep,
                                      "a":"fixed","b":"dynamic",
                                      "a_total":f["total_excursion"],"b_total":d["total_excursion"],
                                      "relative_disagreement":abs(f["total_excursion"]-d["total_excursion"])/denom,
                                  })
              for rep in ("coarse","semantic"):
                  for region in ("centre","inner","middle","outer"):
                      for mode in ("fixed","dynamic"):
                          for trace_type in ("raw","relative"):
                              c = by.get((cert,"core",rep,region,mode,trace_type))
                              w = by.get((cert,"wide",rep,region,mode,trace_type))
                              if c and w and c["total_excursion"] is not None and w["total_excursion"] is not None:
                                  denom = max(abs(c["total_excursion"]), abs(w["total_excursion"]), 1e-12)
                                  facts["comparisons"].append({
                                      "kind":"window", "certificate":cert, "region":region,
                                      "trace_type":trace_type, "representation":rep,"support_mode":mode,
                                      "a":"core","b":"wide",
                                      "a_total":c["total_excursion"],"b_total":w["total_excursion"],
                                      "relative_disagreement":abs(c["total_excursion"]-w["total_excursion"])/denom,
                                      "core_support":c["persistent_support_fraction"],
                                      "wide_support":w["persistent_support_fraction"],
                                  })
          (out_root / "summary.json").write_text(json.dumps(facts, indent=2, allow_nan=False) + "\n")

          # Preserve generated evidence panels, but compress PNGs losslessly.
          from PIL import Image
          for path in out_root.rglob("*.png"):
              im = Image.open(path)
              im.save(path, optimize=True)
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit benchmark outputs and remove temporary workflow
        run: |
          rm .github/workflows/activation-benchmark-temp.yml
          git config user.name "chatgpt-benchmark"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/360/activation .github/workflows/activation-benchmark-temp.yml
          git commit -m "docs: generate activation benchmark evidence"
          git push origin HEAD:issue-26-activation-descriptor
