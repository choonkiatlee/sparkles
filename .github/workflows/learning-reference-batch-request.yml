name: learning-reference-batch-request

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  # Serialize the whole batch against personal diamond/reference publishers.
  # Dispatching many runs into this one group cancels all but one pending run.
  group: sparkles-diamond-catalogue-master-publisher
  cancel-in-progress: false

jobs:
  enrich-reviewed-reference-media:
    # Owner and exact issue title are the only event inputs used. Contents,
    # certificates and URLs are exclusively read from trusted master.
    if: >-
      github.repository == 'choonkiatlee/sparkles' &&
      github.event.issue.user.login == 'choonkiatlee' &&
      github.event.issue.title == 'Enrich learning reference 360s'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout trusted publisher and reviewed references from master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sparkles
        run: python -m pip install -e .

      - name: Enrich 360 candidates serially (retain partial success)
        id: batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/master
        run: |
          python -m diamond_catalogue.reference_batch > "$RUNNER_TEMP/reference-targets"
          success=0
          failed=0
          while IFS= read -r reference_id; do
            test -n "$reference_id" || continue
            echo "::group::Enrich $reference_id"
            if REFERENCE_ID="$reference_id" REFERENCE_MODE=media \
              python -m diamond_catalogue.reference_publish; then
              success=$((success+1))
            else
              failed=$((failed+1))
              echo "::warning title=Reference enrichment failed::See diagnostics for $reference_id"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/reference-targets"
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Reference enrichment completed: $success successful, $failed failed."
          if [ "$failed" -gt 0 ]; then
            echo "::error title=Reference batch partially failed::$failed reference(s) failed. Successful earlier publications were retained."
            exit 1
          fi

      - name: Link issue to enrichment outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUCCEEDED: ${{ steps.batch.outputs.success }}
          FAILED: ${{ steps.batch.outputs.failed }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Reference 360 batch attempted. Successful runs: ${SUCCEEDED:-unknown}; failures: ${FAILED:-unknown}. Check the [batch run](https://github.com/choonkiatlee/sparkles/actions/workflows/learning-reference-batch-request.yml) and the updated static reference index for exact media availability."

  deploy-pages:
    # Even if one reference fails, successfully published others should appear.
    if: always() && needs.enrich-reviewed-reference-media.result != 'skipped'
    needs: enrich-reviewed-reference-media
    uses: ./.github/workflows/catalogue-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
