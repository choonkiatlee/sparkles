name: asscher-optical-switch-perturbation

concurrency:
  group: asscher-optical-switch-perturbation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_optical_switch_confounds.py"
      - "tests/test_asscher_optical_switch_confounds.py"
      - "docs/360/asscher-geometry-validation/OPTICAL-SWITCH-SENSITIVITY.md"
      - ".github/workflows/asscher-optical-switch-perturbation.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Test exposure, illumination, registration and physical provenance negatives
        run: |
          python -m unittest \
            tests.test_asscher_optical_switch_confounds \
            tests.test_asscher_dense_optical_regions \
            tests.test_asscher_optical_physical_provenance \
            tests.test_asscher_geometry_validation -v

      - name: Get frozen original outer selection
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-v2

      - name: Get immutable dense original RGB optical switching atlas
        uses: actions/download-artifact@v4
        with:
          name: asscher-dense-optical-regions
          run-id: 37856375493
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-dense

      - name: Download original RGB sequences and check all four immutable SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest=json.loads(Path("docs/360/benchmark/source-bundles.json").read_text())
          root=Path("outputs/sensitivity-sources")
          root.mkdir(parents=True,exist_ok=True)
          for row in manifest["bundles"]:
              archive=root/row["filename"]
              urllib.request.urlretrieve(row["download_url"],archive)
              assert archive.stat().st_size==row["bytes"]
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==row["sha256"]
              dest=root/row["certificate"]
              dest.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(dest)
          PY

      - name: Perturb camera RGB appearance on same frozen consecutive frames
        run: |
          python -m diamond360.asscher_optical_switch_confounds \
            --source-root outputs/sensitivity-sources \
            --output outputs/asscher-optical-switch-confounds

      - name: Enforce exact frozen source indices and unperturbed optical values
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          out=Path("outputs/asscher-optical-switch-confounds")
          summary=json.loads((out/"summary.json").read_text())
          assert len(summary["stones"])==4
          assert summary["no_estimator_change"]
          assert summary["not_a_physical_facet_or_quality_score"]
          total=0
          for row in summary["stones"]:
              cert=row["certificate"]
              ref=json.loads((Path("outputs/frozen-v2/per-stone")/
                              cert/"primary-wireframe.json").read_text())
              assert row["selected_source_indices"]==[
                  p["source_index"] for p in ref["selected_frames"]
              ]
              past=json.loads((Path("outputs/frozen-dense/per-stone")/
                               cert/"dense-optical-regions.json").read_text())
              present=json.loads((out/row["detail_path"]).read_text())
              assert len(past["pairs"])==len(present["pairs"])
              assert row["measured_pair_count"]==past["measured_pair_count"]
              assert present["all_physical_facet_identity_unavailable"]
              for expected,actual in zip(past["pairs"],present["pairs"]):
                  assert expected["positions"]==actual["positions"]
                  assert expected["source_indices"]==actual["source_indices"]
                  assert expected["status"]==actual["status"]
                  assert actual["facet_semantic_ids"] is None
                  if expected["status"]=="observed":
                      baseline=actual["sensitivity"]["baseline"]
                      for metric in (
                          "median_gain_normalized_abs_change",
                          "total_dark_switch_fraction",
                          "total_bright_switch_fraction"
                      ):
                          assert math.isclose(baseline[metric],expected[metric],
                                              rel_tol=0,abs_tol=1e-10),(cert,metric)
                      assert len(actual["sensitivity"]["scenarios"])==7
                      gain=next(x for x in actual["sensitivity"]["scenarios"]
                               if x["scenario"]=="global_gain_x1p20")
                      assert gain["status"]=="observed"
                      assert abs(gain["delta_from_unperturbed"][
                          "median_gain_normalized_abs_change"])<1e-8
                      total+=1
              print(cert,row["measured_pair_count"],"of",row["pair_count"],
                    "unperturbed diff",row["median_unperturbed_abs_change"],
                    "scenario sensitivity",row["scenario_summary"])
          assert total==74,total
          PY

      - name: Upload optical-only perturbation sensitivity JSON and per-stone charts
        uses: actions/upload-artifact@v4
        with:
          name: asscher-optical-switch-confounds
          path: outputs/asscher-optical-switch-confounds
          retention-days: 90
          if-no-files-found: error
