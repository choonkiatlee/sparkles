name: asscher-frame16-ablation

concurrency:
  group: asscher-frame16-ablation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    paths:
      - "diamond360/asscher_geometry_frame_ablation.py"
      - "tests/test_asscher_geometry_frame_ablation.py"
      - "docs/360/asscher-geometry-validation/FRAME16-DIAGNOSTIC.md"
      - ".github/workflows/asscher-frame16-ablation.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Test target-blind factor ablation
        run: python -m unittest tests.test_asscher_geometry_frame_ablation -v

      - name: Download frozen #115 outer-v2 evidence
        uses: actions/download-artifact@v4
        with:
          name: asscher-geometry-stability-outer-v2
          run-id: 37755387174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen-outer-stability

      - name: Download hash-verified original 256-frame source
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path
          manifest = json.loads(
              Path("docs/360/benchmark/source-bundles.json").read_text()
          )
          item, = [
              row for row in manifest["bundles"]
              if row["certificate"] == "IGI-LG756520111"
          ]
          root = Path("outputs/asscher-frame16-sources")
          root.mkdir(parents=True, exist_ok=True)
          archive = root / item["filename"]
          urllib.request.urlretrieve(item["download_url"], archive)
          assert archive.stat().st_size == item["bytes"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == item["sha256"]
          directory = root / item["certificate"]
          directory.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall(directory)
          PY

      - name: Run four-arm frame-16 factor ablation
        run: |
          python -m diamond360.asscher_geometry_frame_ablation \
            --source-root outputs/asscher-frame16-sources/IGI-LG756520111 \
            --source-manifest docs/360/benchmark/per-stone/IGI-LG756520111/source-manifest.json \
            --reference-dir outputs/frozen-outer-stability \
            --output outputs/asscher-frame16-ablation

      - name: Upload diagnostic reports and camera-RGB QC
        uses: actions/upload-artifact@v4
        with:
          name: asscher-frame16-ablation
          path: outputs/asscher-frame16-ablation
          retention-days: 90
          if-no-files-found: error
