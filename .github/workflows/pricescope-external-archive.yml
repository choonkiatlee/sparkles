name: PriceScope external archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and hash source media
        run: |
          python tools/archive_pricescope_external.py --out /tmp/pricescope-archive

      - name: Upload raw archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricescope-external-archive
          path: /tmp/pricescope-archive
          if-no-files-found: error
          retention-days: 7
