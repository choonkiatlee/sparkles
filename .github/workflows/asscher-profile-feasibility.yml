name: asscher-profile-feasibility

on:
  pull_request:
    paths:
      - "diamond360/asscher_profile_feasibility.py"
      - "tests/test_asscher_profile_feasibility.py"
      - "docs/360/asscher-geometry-validation/PROFILE-FEASIBILITY.md"
      - "docs/360/geometry-ground-truth/diagem-2008-asscher/profile-photo.JPG"
      - ".github/workflows/asscher-profile-feasibility.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run focused target-blind tests
        run: python -m unittest tests.test_asscher_profile_feasibility -v
      - name: Generate audited image-only feasibility diagnostics
        run: |
          python -m diamond360.asscher_profile_feasibility \
            --image docs/360/geometry-ground-truth/diagem-2008-asscher/profile-photo.JPG \
            --require-original \
            --output outputs/asscher-profile-feasibility
      - name: Assert no semantic angles were manufactured
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/asscher-profile-feasibility/profile-feasibility.json")
          data = json.loads(p.read_text())
          assert data["source"]["archived_original_match"]
          assert data["status"] in {"review", "unavailable"}
          assert data["projection_suitability"]["status"] == "not_assessed"
          for side in data["semantic_measurements"].values():
              for row in side.values():
                  assert row["status"] == "unavailable"
                  assert row["apparent_angle_deg"] is None
                  assert row["uncertainty_deg"] is None
          for name in ("gradient-evidence.png", "unassigned-line-candidates.png"):
              assert (p.parent / name).is_file()
          print("Source/hash verified; no facet or physical angles inferred.")
          print("Unassigned candidate count:",
                len(data["image_evidence"]["line_candidates"]))
          PY
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: asscher-profile-feasibility
          path: outputs/asscher-profile-feasibility
          if-no-files-found: error
          retention-days: 90
