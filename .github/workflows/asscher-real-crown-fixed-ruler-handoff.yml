name: asscher-real-crown-fixed-ruler-handoff

on:
  pull_request:
    paths:
      - "diamond360/asscher_real_semantic_replay.py"
      - "tests/test_asscher_real_semantic_replay.py"
      - "docs/360/asscher-geometry-validation/REAL-CROWN-FIXED-RULER-REPLAY.md"
      - ".github/workflows/asscher-real-crown-fixed-ruler-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-crown-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Check frozen handoff contract and synthetic plot tests
        run: |
          python -m unittest \
            tests.test_asscher_semantic_optical_handoff \
            tests.test_asscher_real_semantic_replay -v
      - name: Download exact frozen #89 primary scaffold and frame transfer
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          mkdir -p outputs/asscher-real-replay/frozen
          gh run download 37830584391 \
            --repo choonkiatlee/sparkles \
            --name asscher-geometry-stability-outer-v2 \
            --dir outputs/asscher-real-replay/frozen
          python - <<'PY'
          from pathlib import Path
          from diamond360 import asscher_real_semantic_replay as r
          p=Path("outputs/asscher-real-replay/frozen/per-stone/IGI-LG756520111")
          _,records=r.verify_frozen_archive(p/"primary-wireframe.json",p/"transfer.json")
          print("Original #89 archived primary and transfer records verified:", len(records))
          PY
      - name: Download only one pinned original 360 source bundle
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, zipfile
          from pathlib import Path
          m=json.loads(Path("docs/360/benchmark/source-bundles.json").read_text())
          item=next(v for v in m["bundles"] if v["certificate"]=="IGI-LG756520111")
          folder=Path("outputs/asscher-real-replay/source")
          folder.mkdir(parents=True,exist_ok=True)
          archive=folder/item["filename"]
          urllib.request.urlretrieve(item["download_url"], archive)
          assert archive.stat().st_size==item["bytes"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==item["sha256"]
          dest=folder/item["certificate"]
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:z.extractall(dest)
          print("Only one source bundle verified, exact SHA:",item["sha256"])
          PY
      - name: Replay actual crown frames using frozen 89 scaffold without fitting
        run: |
          python -m diamond360.asscher_real_semantic_replay \
            --source outputs/asscher-real-replay/source/IGI-LG756520111 \
            --source-manifest docs/360/benchmark/per-stone/IGI-LG756520111/source-manifest.json \
            --frozen-primary outputs/asscher-real-replay/frozen/per-stone/IGI-LG756520111/primary-wireframe.json \
            --frozen-transfer outputs/asscher-real-replay/frozen/per-stone/IGI-LG756520111/transfer.json \
            --output outputs/asscher-real-replay/result
      - name: Verify actual support was sampled without moving geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/asscher-real-replay/result")
          report=json.loads((p/"real-crown-handoff.json").read_text())
          assert report["real_source_certificate"]=="IGI-LG756520111"
          assert report["source_frame_indices"]==[4,8,12,16,20,24,28]
          assert report["counts"]["frames"]==7
          assert report["reprocessed_gauge_equals_original"]
          assert report["has_any_new_geometry_fits"] is False
          assert report["physical_inner_facets_verified"] is False
          assert report["quality_or_optical_score_computed"] is False
          assert any(row["raw_mean_brightness"] is not None
                     for frame in report["frames"] for row in frame["entities"])
          assert all(row["normalized_mean_brightness"] is None
                     for frame in report["frames"] for row in frame["entities"])
          assert all(row["physical_facet_correspondence"]=="not_established"
                     for frame in report["frames"] for row in frame["entities"])
          for name in ("real-crown-brightness-traces.png","real-crown-fixed-ruler-rgb.png"):
              assert (p/name).is_file()
          for frame in report["frames"]:
              sampled=sum(row["supported_pixel_count"]>0 for row in frame["entities"])
              print("real src",frame["source_index"],"phase",frame["entities"][0]["rotation_phase_deg"],
                    "sampled entities",sampled,"of",report["counts"]["entities"])
          PY
      - name: Upload small original-source smoke audit
        uses: actions/upload-artifact@v4
        with:
          name: asscher-real-crown-fixed-ruler-smoke
          path: |
            outputs/asscher-real-replay/result/real-crown-handoff.json
            outputs/asscher-real-replay/result/real-crown-brightness-traces.png
            outputs/asscher-real-replay/result/real-crown-fixed-ruler-rgb.png
          if-no-files-found: error
          retention-days: 90
